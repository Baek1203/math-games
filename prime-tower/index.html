  if (!g.towers.length) return G.place ? '밝게 보이는 빈 칸을 누르면 수호대가 서요. 길 가까이에 세우세요.' : '오른쪽에서 토끼(2)를 고른 뒤, 길 옆 빈 칸을 눌러 세워 보세요.';
  if (!g.active && g.wave === 0) return '준비가 되면 1웨이브 시작을 누르세요. 몬스터가 동굴에서 나와요.';
  if (g.active && g.wave === 0) return '수호대는 자기 수로 나누어떨어지는 몬스터만 공격해요. 몬스터의 수가 1이 되면 사라져요!';
  if (!g.active && g.wave === 1) return '오른쪽 아래의 다음 웨이브 수를 보고 수호대를 더 불러요. 코인은 몬스터를 물리치면 생겨요.';
  return '';
}
function updateHUD() {
  const g = G.g;
  if (!g) return;
  const vals = { hWave: `${Math.min(WAVES, g.wave + 1)}/${WAVES}`, hLives: String(g.lives), hCoins: fmt(g.coins), hScore: fmt(g.score) };
  for (const k in vals) {
    if (G.hud[k] !== vals[k]) { G.hud[k] = vals[k]; const el = document.getElementById(k); if (el) el.textContent = vals[k]; }
  }
  if (G.hud.coinsRaw !== g.coins) {
    G.hud.coinsRaw = g.coins;
    document.querySelectorAll('.guard[data-p]').forEach(b => { if (!b.disabled) b.classList.toggle('poor', g.coins < TOWERS[Number(b.dataset.p)].cost); });
    const up = document.querySelector('[data-act="upgrade"]');
    if (up && G.sel && G.sel.level < MAX_LEVEL) up.disabled = g.coins < upgradeCost(G.sel.p, G.sel.level);
  }
  const state = g.over ? 'over' : g.active ? 'active' : 'idle';
  if (G.hud.state !== state || G.hud.waveNo !== g.wave) {
    G.hud.state = state;
    G.hud.waveNo = g.wave;
    const b = $('#waveBtn'), l = $('#waveLbl');
    if (b && l) {
      b.disabled = state !== 'idle';
      l.textContent = state === 'idle' ? `${g.wave + 1}웨이브 시작` : state === 'active' ? `${g.wave + 1}웨이브 진행 중` : '경기 끝';
    }
  }
  const h = hintText();
  if (G.hintText !== h) { G.hintText = h; const el = $('#hint'); if (el) { el.textContent = h; el.hidden = !h; } }
}
function bump(sel, cls) {
  const el = $(sel);
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function toast(text) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(G.toastTimer);
  G.toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
}
function onEngineEvent(e) {
  if (G.board) G.board.event(e);
  if (e.type === 'fire') Sound.play('shot' + e.tower.p);
  else if (e.type === 'kill') Sound.play(e.boss ? 'clear' : 'pop');
  else if (e.type === 'boss') { if (G.board) G.board.showBanner('보스 등장!', 'boss', fmt(e.m.n0)); Sound.play('boss'); }
  else if (e.type === 'wave') {
    if (e.wave < WAVES) {
      Sound.play('clear');
      if (G.board) G.board.showBanner(`${e.wave}웨이브 성공!`, 'good', `코인 +${e.bonus}`);
      const opening = LEVELS[G.g.levelId].primes.filter(p => unlockedAt(G.g.levelId, p) === e.wave + 1);
      if (opening.length) later(() => toast(`${opening.map(p => `${TOWERS[p].name}(${p})`).join(', ')}${iGa(TOWERS[opening[opening.length - 1]].name)} 합류했어요!`), 1500);
    }
    G.snap = null;
    renderSide();
    saveRun();
    pushLive();
  } else if (e.type === 'leak') {
    Sound.play('leak');
    bump('#livesPill', 'hurt');
    toast(`몬스터가 성에 닿았어요. 목숨 -${e.cost}`);
    pushLive();
  }
}
function gameLoop(ts) {
  if (view !== 'game' || !G.g) return;
  const dtReal = G.last ? Math.min(0.05, (ts - G.last) / 1000) : 0;
  G.last = ts;
  const g = G.g;
  if (!G.paused && !g.over) {
    let step = dtReal * G.speed;
    while (step > 1e-6) { const d = Math.min(step, 1 / 30); update(g, d, onEngineEvent); step -= d; }
  }
  G.board.draw(g, G, G.paused ? 0 : dtReal * (G.speed === 2 ? 1.5 : 1));
  updateHUD();
  if (g.over && !G.ending) {
    G.ending = true;
    if (G.board) G.board.showBanner(g.won ? '방어 성공!' : '성이 무너졌어요', g.won ? 'good' : 'boss');
    setTimeout(() => { if (G.g === g) finishGame(g.won); }, 1600);
  }
  G.raf = requestAnimationFrame(gameLoop);
}
function aimCoins() {
  const pill = $('#coinPill'), canvas = $('#board');
  if (!pill || !canvas || !G.board) return;
  const a = pill.getBoundingClientRect(), b = canvas.getBoundingClientRect();
  G.board.setCoinTarget(a.left + a.height * 0.55 - b.left, a.top + a.height / 2 - b.top);
}
function afterGame() {
  const canvas = $('#board');
  G.board = createBoard(canvas, { theme: G.g.map.theme, onCoin: () => bump('#coinPill', 'gain') });
  G.last = 0;
  G.hud = {};
  G.hintText = null;
  aimCoins();
  canvas.addEventListener('pointermove', e => { G.hover = G.board.cellAt(e.clientX, e.clientY); });
  canvas.addEventListener('pointerleave', () => { G.hover = null; });
  canvas.addEventListener('click', e => onBoardClick(G.board.cellAt(e.clientX, e.clientY)));
  cancelAnimationFrame(G.raf);
  G.raf = requestAnimationFrame(gameLoop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G.board) { G.board.invalidate(); aimCoins(); } });
}
function onBoardClick(cell) {
  const g = G.g;
  if (!g || !cell || g.over) return;
  const t = towerAt(g, cell.c, cell.r);
  if (G.place) {
    if (t) { G.place = null; G.sel = t; Sound.play('click'); renderSide(); return; }
    const err = build(g, cell.c, cell.r, G.place);
    if (err === 'coins') { toast('코인이 모자라요.'); Sound.play('no'); }
    else if (err === 'blocked') { toast(isPathCell(g.map, cell.c, cell.r) ? '길 위에는 세울 수 없어요.' : '여기에는 세울 수 없어요.'); Sound.play('no'); }
    else if (!err) { G.sel = null; G.board.puff(cell.c, cell.r); Sound.play('build'); saveRun(); }
    renderSide();
    return;
  }
  G.sel = t || null;
  if (t) Sound.play('click');
  renderSide();
}
function choosePlace(p) {
  if (!G.g || G.g.over) return;
  if (unlockedAt(G.g.levelId, p) > G.g.wave + 1 || !LEVELS[G.g.levelId].primes.includes(p)) return;
  G.place = G.place === p ? null : p;
  G.sel = null;
  Sound.play('click');
  renderSide();
}
function onGiveup(btn) {
  if (!giveupArmed) {
    giveupArmed = true;
    btn.textContent = '한 번 더 누르면 기권해요';
    btn.classList.add('armed');
    later(() => { giveupArmed = false; if (btn.isConnected) { btn.textContent = '기권하기'; btn.classList.remove('armed'); } }, 3000);
    return;
  }
  giveupArmed = false;
  const g = G.g;
  if (!g) return;
  g.over = true;
  g.won = false;
  finishGame(false);
}

function pickTip() {
  const open = TIPS.filter(t => t.need(me));
  if (!open.length) return '';
  const fresh = open.find(t => !me.tipsSeen.includes(t.id));
  if (fresh) { me.tipsSeen.push(fresh.id); return fresh.text; }
  return open[Math.floor(Math.random() * open.length)].text;
}
function finishGame(won) {
  const g = G.g;
  if (!g || !me) return;
  cancelAnimationFrame(G.raf);
  const lv = me.lv[g.levelId];
  const stars = starsFor(won, g.lives, g.levelId);
  const prevStars = lv.stars || 0;
  me.finished += 1;
  lv.f += 1;
  me.kills += g.kills;
  lv.bestWave = Math.max(lv.bestWave, g.wave);
  lv.stars = Math.max(prevStars, stars);
  if (lv.bestScore == null || g.score > lv.bestScore) lv.bestScore = g.score;
  if (won) { me.wins += 1; lv.w += 1; if (G.via === 'code') me.codeWins += 1; }
  const code = formatCode(g.levelId, g.seed);
  me.recent.unshift({ t: Date.now(), levelId: g.levelId, code, won, wave: g.wave, lives: g.lives, score: g.score, stars, via: G.via });
  me.recent = me.recent.slice(0, 20);
  const newly = [];
  const award = id => { if (!me.badges.includes(id)) { me.badges.push(id); newly.push(id); } };
  award('debut');
  if (me.finished >= 5) award('g5');
  if (won && G.via === 'code') award('rival');
  if (won) award('clear' + g.levelId);
  if (won && g.leaks === 0) award('perfect');
  if (stars === 3) award('star3');
  if ([1, 2, 3].every(k => (me.lv[k].stars || 0) >= 3)) award('allstars');
  if (g.bossKills > 0) award('boss');
  if (won && g.levelId >= 2 && g.maxTowers <= 20) award('frugal');
  if (g.upgrades >= 5) award('upgrader');
  if (me.kills >= 300) award('k300');
  if (won && g.lives === 1) award('lastlife');
  if (g.biggest > 100000) award('giant');
  const tip = pickTip();
  const fired = {};
  g.towers.forEach(t => { fired[t.p] = (fired[t.p] || 0) + t.fired; });
  store.del(KEY.save(me.key));
  saveProfile();
  Net.addGame({ key: me.key, sid: me.sid, name: me.name, levelId: g.levelId, code, won, wave: g.wave, lives: g.lives, score: g.score, stars, kills: g.kills, via: G.via, t: Date.now() });
  Sound.play(won ? 'win' : 'lose');
  lastResult = {
    levelId: g.levelId, seed: g.seed, won, wave: g.wave, lives: g.lives, score: g.score, kills: g.kills, biggest: g.biggest,
    leaked: g.leaked.slice(), fired, maxTowers: g.maxTowers, newly, tip, stars, newBest: stars > prevStars,
  };
  G.g = null;
  go('result');
}

/* ===== 이동 ===== */
function join() {
  const inp = $('#codeIn'), err = $('#joinErr');
  if (!inp) return;
  const digits = inp.value.replace(/\D/g, '');
  if (!digits) { err.textContent = '경기 코드를 입력하세요. 예: 2-4821'; inp.focus(); return; }
  const p = parseCode(inp.value);
  if (!p) { err.textContent = digits.length !== 5 ? '경기 코드는 숫자 다섯 자리예요. 예: 2-4821' : '경기 코드는 1, 2, 3 중 하나로 시작해요.'; inp.focus(); inp.select(); return; }
  startGame(p.levelId, p.seed, 'code');
}
function applyBig() {
  document.documentElement.classList.toggle('big', big);
  const b = $('#bigBtn');
  b.setAttribute('aria-pressed', String(big));
  b.textContent = big ? '원래 크기로' : '화면 크게';
}
function render() {
  clearTimers();
  giveupArmed = false;
  stopDemo();
  if (view !== 'game') cancelAnimationFrame(G.raf);
  if (!me && view !== 'home' && view !== 'teacher') view = 'home';
  if (view === 'game' && !G.g) view = 'home';
  if (view === 'result' && !lastResult) view = 'home';
  const closed = closedByTeacher() && (view === 'home' || view === 'records');
  const html = closed ? closedHTML()
    : view === 'home' ? homeHTML()
    : view === 'game' ? gameHTML()
    : view === 'result' ? resultHTML()
    : view === 'records' ? recordsHTML()
    : teacherHTML();
  $('#view').innerHTML = html;
  document.body.dataset.screen = closed ? 'closed' : view;
  document.body.dataset.theme = view === 'game' && G.g ? G.g.map.theme : view === 'result' && lastResult ? MAPS[LEVELS[lastResult.levelId].map].theme : '';
  const homeBtn = $('#homeBtn');
  homeBtn.hidden = view === 'home';
  homeBtn.textContent = view === 'teacher' ? '학생 화면으로' : '처음으로';
  const chip = $('#meChip');
  chip.hidden = !me || view === 'home' || view === 'teacher';
  chip.innerHTML = me ? `<span class="no">${esc(me.sid)}</span>${esc(me.name)}` : '';
  updateFoot();
  pushLive();
  if (closed) return;
  if (view === 'home') { startDemo(); Sprites.ready.then(() => { if (view === 'home') drawThumbs(); }); }
  else if (view === 'game') afterGame();
  else if (view === 'result') { const b = document.querySelector('[data-act="again"]'); if (b && !coarse()) b.focus({ preventScroll: true }); }
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  switch (a.dataset.act) {
    case 'home':
      if (view === 'teacher') leaveTeacher();
      else { if (view === 'game') saveRun(); go('home'); }
      break;
    case 'toggleBig': big = !big; store.set(KEY.big, big); applyBig(); if (G.board && view === 'game') { G.board.resize(); aimCoins(); } if (view === 'home') { startDemo(); drawThumbs(); } break;
    case 'login': doLogin(); break;
    case 'logout': doLogout(); break;
    case 'records': if (me) go('records'); break;
    case 'practice': { const lv = Number(a.dataset.level) || 1; homeLevel = lv; startGame(lv, randomSeed(), 'practice'); break; }
    case 'join': join(); break;
    case 'resume': { const s = loadSavedRun(); if (s) startGame(s.levelId, s.seed, s.via === 'code' ? 'code' : 'practice', s); else render(); break; }
    case 'again': { const lv = Number(a.dataset.level) || 1; homeLevel = lv; startGame(lv, randomSeed(), 'practice'); break; }
    case 'place': choosePlace(Number(a.dataset.p)); break;
    case 'upgrade':
      if (G.g && G.sel) {
        const err = upgradeTower(G.g, G.sel);
        if (err === 'coins') { toast('코인이 모자라요.'); Sound.play('no'); }
        else if (!err) { G.board.sparkle(G.sel.c, G.sel.r); Sound.play('upgrade'); if (G.sel.level === MAX_LEVEL) toast(`${TOWERS[G.sel.p].title}${iGa(TOWERS[G.sel.p].title)} 왕관을 썼어요!`); saveRun(); }
        renderSide();
      }
      break;
    case 'sell': if (G.g && G.sel) { G.board.puff(G.sel.c, G.sel.r); sellTower(G.g, G.sel); G.sel = null; Sound.play('sell'); saveRun(); renderSide(); } break;
    case 'wave':
      if (G.g && !G.g.active && !G.g.over) {
        G.snap = snapshot(G.g);
        const W = G.g.waves[G.g.wave];
        startWave(G.g);
        if (G.board) G.board.showBanner(`${G.g.wave + 1}웨이브`, '', W.list.some(m => m.boss) ? '보스가 섞여 있어요' : `몬스터 ${W.list.length}마리`);
        Sound.play('wave');
        saveRun();
        renderSide();
        pushLive();
      }
      break;
    case 'speed': G.speed = G.speed === 1 ? 2 : 1; a.setAttribute('aria-pressed', String(G.speed === 2)); break;
    case 'pause': G.paused = !G.paused; a.setAttribute('aria-pressed', String(G.paused)); a.querySelector('span').textContent = G.paused ? '계속하기' : '일시정지'; { const n = $('#pauseNote'); if (n) n.hidden = !G.paused; } break;
    case 'sound': Sound.set(!Sound.on); store.set(KEY.sound, Sound.on); a.setAttribute('aria-pressed', String(Sound.on)); a.innerHTML = `${Sound.on ? ICON.sound : ICON.mute}<span>소리</span>`; Sound.play('click'); break;
    case 'giveup': onGiveup(a); break;
    default: onTeacherAct(a);
  }
});

document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  const id = e.target.id;
  if (e.key === 'Enter') {
    if (id === 'codeIn') { e.preventDefault(); join(); }
    else if (id === 'sidIn') { e.preventDefault(); const n = $('#nameIn'); if (n && !n.value.trim()) n.focus(); else doLogin(); }
    else if (id === 'nameIn') { e.preventDefault(); doLogin(); }
    else if (id === 'tcodeIn') { e.preventDefault(); showCode(e.target.value); }
    return;
  }
  if (view !== 'game' || !G.g) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) return;
  if (['2', '3', '5', '7'].includes(e.key)) { choosePlace(Number(e.key)); e.preventDefault(); }
  else if (e.key === 'Escape') { G.place = null; G.sel = null; renderSide(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); const b = $('#waveBtn'); if (b && !b.disabled) b.click(); }
});

const T = {
  tab: 'live', cls: 'all', sort: { col: 'sid', dir: 1 }, open: null,
  code: '', genLevel: 2, reveal: {}, players: {}, live: {}, games: {},
  err: '', note: '', busy: false, armed: null, armTimer: null,
  unsub: [], codeUnsub: null, tick: null,
};
const TTABS = [['live', '수업 현황'], ['code', '경기 코드'], ['students', '학생 기록'], ['manage', '관리']];

const groupOf = sid => (typeof sid === 'string' && sid.length >= 4 ? sid.slice(0, sid.length - 2) : '');
const groupLabel = g => (g.length >= 2 ? `${g[0]}학년 ${Number(g.slice(1))}반` : g);
const inCls = sid => T.cls === 'all' || groupOf(sid) === T.cls;
function groupsFrom(sids) {
  const set = new Set();
  sids.forEach(sid => { const g = groupOf(sid); if (g) set.add(g); });
  return [...set].sort();
}
function clock(t) {
  const d = new Date(Number(t));
  if (Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function rel(t) {
  const n = Number(t);
  if (!n) return '';
  const s = Math.max(0, Math.round((Date.now() - n) / 1000));
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  return clock(n);
}

function teacherCodes() {
  const a = store.get(KEY.tcodes, []);
  return (Array.isArray(a) ? a : []).filter(x => x && typeof x.code === 'string' && parseCode(x.code));
}
function addTeacherCode(levelId) {
  const code = formatCode(levelId, randomSeed());
  const list = teacherCodes().filter(x => x.code !== code);
  list.unshift({ code, t: Date.now() });
  store.set(KEY.tcodes, list.slice(0, 20));
  return code;
}

/* ----- 들어가고 나오기, 자료 받기 ----- */
function openTeacher() {
  view = 'teacher';

  render();
  window.scrollTo(0, 0);
  startTeacherData();
}
function leaveTeacher() {
  stopTeacherData();
  Net.teacherSignOut().catch(() => {});
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
  T.err = '';
  T.note = '';
  go('home');
  if (me) Net.startPresence(me.key, liveData());
}
function startTeacherData() {
  stopTeacherData();
  if (view !== 'teacher') return;
  if (Net.mode === 'pending') {
    Net.ready.then(() => { if (view === 'teacher') { render(); startTeacherData(); } });
    return;
  }
  if (Net.mode === 'firebase' && !Net.teacher()) return;
  const denied = () => {
    T.err = '이 계정으로는 기록을 볼 수 없어요. 규칙 파일에 적은 선생님 Google 계정으로 로그인했는지 확인하세요.';
    renderTeacherBody();
  };
  T.unsub.push(Net.watch('players', v => { T.players = v || {}; onTeacherData('players'); }, denied));
  T.unsub.push(Net.watch('live', v => { T.live = v || {}; onTeacherData('live'); }, denied));
  if (T.code) watchCode(T.code);
  T.tick = setInterval(() => { if (view === 'teacher' && T.tab === 'live') renderTeacherBody(); }, 20000);
}
function stopTeacherData() {
  T.unsub.forEach(f => { try { f(); } catch (e) { /* 무시 */ } });
  T.unsub = [];
  if (T.codeUnsub) { try { T.codeUnsub(); } catch (e) { /* 무시 */ } T.codeUnsub = null; }
  if (T.tick) { clearInterval(T.tick); T.tick = null; }
}
function watchCode(code) {
  if (T.codeUnsub) { try { T.codeUnsub(); } catch (e) { /* 무시 */ } T.codeUnsub = null; }
  T.games = {};
  if (Net.mode === 'pending' || (Net.mode === 'firebase' && !Net.teacher())) return;
  T.codeUnsub = Net.watch({ code }, v => { T.games = v || {}; onTeacherData('games'); }, () => {
    T.err = '경기 기록을 불러오지 못했어요. 선생님 계정과 규칙 파일을 확인하세요.';
    renderTeacherBody();
  });
}
function onTeacherData(kind) {
  if (view !== 'teacher') return;
  if (kind === 'games') { if (T.tab === 'code') renderCodeResults(); return; }
  if (kind === 'live' && T.tab !== 'live') return;
  if (kind === 'players' && T.tab === 'code') return;
  renderTeacherBody();
}
function renderTeacherBody() { const b = $('#tbody'); if (b) b.innerHTML = teacherBodyHTML(); }
function renderCodeResults() { const b = $('#codeResults'); if (b) b.innerHTML = codeResultsHTML(); }

async function teacherSignIn() {
  T.busy = true;
  T.err = '';
  render();
  try {
    await Net.teacherSignIn();
  } catch (e) {
    const c = e && e.code;
    T.err = c === 'auth/popup-blocked' ? '팝업이 막혔어요. 주소창에서 팝업을 허용한 뒤 다시 눌러 주세요.'
      : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? '로그인 창이 닫혔어요. 다시 눌러 주세요.'
      : c === 'auth/unauthorized-domain' ? '이 주소에서는 로그인할 수 없어요. Authentication 설정의 승인된 도메인에 이 주소를 추가하세요.'
      : c === 'auth/operation-not-allowed' ? 'Google 로그인이 꺼져 있어요. Authentication에서 Google 로그인을 사용 설정하세요.'
      : '로그인하지 못했어요. 다시 시도해 주세요.';
  }
  T.busy = false;
  render();
  startTeacherData();
}

function liveTabHTML() {
  const now = Date.now();
  const rows = Object.entries(T.live).map(([key, v]) => Object.assign({ key }, v)).filter(r => typeof r.sid === 'string');
  const groups = groupsFrom([...rows.map(r => r.sid), ...Object.values(T.players).map(p => p && p.sid)]);
  const shown = rows.filter(r => inCls(r.sid)).sort((a, b) => a.sid.localeCompare(b.sid) || String(a.name).localeCompare(String(b.name)));
  const isOn = r => r.online === true && now - (Number(r.t) || 0) < 15 * 60 * 1000;
  const on = shown.filter(isOn);
  const playing = on.filter(r => r.state === 'game').length;
  const today = new Date().toDateString();
  let doneToday = 0;
  Object.values(T.players).forEach(p => {
    if (p && inCls(p.sid)) toArr(p.recent).forEach(g => { if (g && new Date(Number(g.t)).toDateString() === today) doneToday += 1; });
  });
  const list = shown.length
    ? `<ul class="live-list">${shown.map(r => `<li class="${isOn(r) ? 'on' : 'off'}">
  <span class="dot${isOn(r) ? ' on' : ''}" aria-hidden="true"></span>
  <span class="lv-sid">${esc(r.sid)}</span>
  <span class="lv-name">${esc(r.name || '')}</span>
  <span class="lv-state">${liveState(r)}</span>
  <span class="lv-time">${isOn(r) ? rel(r.t) : '접속 끊김'}</span>
</li>`).join('')}</ul>`
    : '<p class="muted">아직 들어온 학생이 없어요. 학생들이 학번과 이름으로 입장하면 여기에 나타나요.</p>';
  return `<div class="filters">${classFilter(groups)}<span class="spacer"></span>
  <button type="button" class="text-btn" data-act="tclearLive">${T.armed === 'live' ? '한 번 더 누르면 현황을 비워요' : '현황 비우기'}</button></div>
<section class="board t-board">
  <div class="plates three">
    <div class="plate"><span class="lbl">접속 중</span><span class="led val">${on.length}</span></div>
    <div class="plate"><span class="lbl">경기 중</span><span class="led val">${playing}</span></div>
    <div class="plate"><span class="lbl">오늘 끝낸 경기</span><span class="led val">${doneToday}</span></div>
  </div>
</section>
<section class="panel t-section"><h2>학생별 현황</h2>${list}</section>`;
}

function codeTabHTML() {
  const codes = teacherCodes();
  const made = codes.length
    ? `<ul class="code-list">${codes.map(c => {
        const p = parseCode(c.code);
        return `<li><span class="lvl-chip lv${p.levelId}">${LEVELS[p.levelId].name}</span><span class="cl-code">${c.code}</span>
  <button type="button" class="btn" data-act="tshow" data-code="${c.code}">결과 보기</button></li>`;
      }).join('')}</ul>`
    : '<p class="muted small">만든 코드는 이 노트북에 남아서 다음에도 볼 수 있어요.</p>';
  return `<div class="t-grid">
  <section class="panel">
    <h2>수업용 코드 만들기</h2>
    <p class="muted small">난이도를 고르고 코드를 만들어 칠판에 적어 주세요. 같은 코드면 모든 학생에게 같은 몬스터가 같은 순서로 나와요.</p>
    <div class="seg" role="radiogroup" aria-label="난이도">${[1, 2, 3].map(id =>
      `<button type="button" role="radio" aria-checked="${T.genLevel === id}" data-act="tgenlv" data-level="${id}">${LEVELS[id].name}</button>`).join('')}</div>
    <div class="actions"><button type="button" class="btn primary" data-act="tgen">새 코드 만들기</button></div>
    ${made}
  </section>
  <section class="panel">
    <h2><label for="tcodeIn">경기 코드 결과 보기</label></h2>
    <p class="muted small">학생들이 알려 준 코드나 직접 만든 코드를 넣으면, 그 코드로 끝낸 경기가 실시간으로 모여요.</p>
    <div class="inline-row"><input id="tcodeIn" class="code-in" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="7" placeholder="예: 2-4821" value="${esc(T.code)}"><button type="button" class="btn" data-act="tshow">보기</button></div>
    <p class="err" id="tcodeErr" role="alert"></p>
  </section>
</div>
<div id="codeResults">${codeResultsHTML()}</div>`;
}

function codeResultsHTML() {
  if (!T.code) return '';
  const p = parseCode(T.code);
  if (!p) return '';
  const all = Object.values(T.games).filter(g => g && g.code === T.code && typeof g.sid === 'string');
  const W = typeof WAVES === 'number' ? WAVES : 15;
  const first = new Map();
  all.slice().sort((a, b) => (Number(a.t) || 0) - (Number(b.t) || 0)).forEach(g => {
    const k = g.key || keyOf(g.sid, g.name || '');
    if (!first.has(k)) first.set(k, g);
  });
  const groups = groupsFrom([...first.values()].map(g => g.sid));
  const rows = [...first.values()].filter(g => inCls(g.sid));
  const wins = rows.filter(g => g.won);
  const reached = g => (g.won ? W : Math.min(W, (Number(g.wave) || 0) + 1));
  const avgWave = rows.length ? (rows.reduce((s, g) => s + reached(g), 0) / rows.length).toFixed(1) : '-';
  const best = rows.length ? fmt(Math.max(...rows.map(g => Number(g.score) || 0))) : '-';
  const buckets = Array(W + 1).fill(0);
  rows.forEach(g => { buckets[g.won ? W : reached(g) - 1] += 1; });
  const top = Math.max(1, ...buckets);
  const hist = buckets.map((n, i) => `<div class="hbar${i === W ? ' goal' : ''}"><span class="hcnt led">${n || ''}</span><span class="track"><span class="bar" style="height:${n ? Math.max(4, Math.round(n / top * 100)) : 0}%"></span></span><span class="htick">${i === W ? '성공' : i + 1}</span></div>`).join('');
  const ranked = rows.slice().sort((a, b) => ((Number(b.score) || 0) - (Number(a.score) || 0)) || ((Number(a.t) || 0) - (Number(b.t) || 0)));
  const list = ranked.length
    ? `<ol class="rank">${ranked.map((g, i) => `<li><span class="rk">${i + 1}</span><span class="lv-sid">${esc(g.sid)}</span><span class="lv-name">${esc(g.name || '')}</span><span class="${g.won ? 'ok' : 'muted-inline'}">${g.won ? `방어 성공, 목숨 ${Number(g.lives)}` : `${reached(g)}웨이브에서 무너짐`}</span><span class="lv-score">${fmt(Number(g.score) || 0)}점</span><span class="lv-time">${clock(g.t)}</span></li>`).join('')}</ol>`
    : '<p class="muted">아직 이 코드로 끝낸 경기가 없어요.</p>';
  return `<section class="board t-board">
  <div class="rec-head"><span class="lvl-chip lv${p.levelId}">${LEVELS[p.levelId].name}</span><h2 class="code-title led">${T.code}</h2></div>
  <div class="plates four">
    <div class="plate"><span class="lbl">참가</span><span class="led val">${rows.length}</span></div>
    <div class="plate"><span class="lbl">방어 성공</span><span class="led val">${wins.length}</span></div>
    <div class="plate"><span class="lbl">평균 도달 웨이브</span><span class="led val">${avgWave}</span></div>
    <div class="plate"><span class="lbl">최고 점수</span><span class="led val">${best}</span></div>
  </div>
  <p class="hist-cap">몇 웨이브에서 무너졌는지, 끝까지 막았는지</p>
  <div class="hist hist16" role="img" aria-label="무너진 웨이브별 인원과 방어 성공 인원">${hist}</div>
</section>
<section class="panel t-section">
  <div class="filters"><h2>학생별 결과</h2><span class="spacer"></span>${classFilter(groups)}</div>
  <p class="muted small">같은 코드로 여러 번 한 학생은 첫 경기만 셉니다.</p>
  ${list}
</section>`;
}

const SCOLS = [
  ['sid', '학번', 'l'], ['name', '이름', 'l'], ['finished', '경기'], ['wins', '방어 성공'],
  ['b1', '입문 최고'], ['b2', '기본 최고'], ['b3', '도전 최고'], ['kills', '물리친 몬스터'], ['badges', '모은 기록'], ['last', '마지막 경기'],
];
function studentRows() {
  return Object.values(T.players).filter(p => p && typeof p.sid === 'string').map(p => {
    const lv = k => (p.lv && p.lv[k]) || {};
    const best = k => (lv(k).bestScore != null && Number.isFinite(Number(lv(k).bestScore)) ? Number(lv(k).bestScore) : null);
    const last = toArr(p.recent).reduce((m, g) => Math.max(m, Number(g && g.t) || 0), 0);
    return {
      key: p.key || keyOf(p.sid, String(p.name || '')), sid: p.sid, name: String(p.name || ''),
      finished: Number(p.finished) || 0, wins: Number(p.wins) || 0, kills: Number(p.kills) || 0,
      b1: best(1), b2: best(2), b3: best(3), badges: toArr(p.badges).length, last: last || null, raw: p,
    };
  });
}
function sortedStudents() {
  const rows = studentRows().filter(r => inCls(r.sid));
  const { col, dir } = T.sort;
  return rows.sort((a, b) => {
    const va = a[col], vb = b[col];
    if (va == null && vb == null) return a.sid.localeCompare(b.sid);
    if (va == null) return 1;
    if (vb == null) return -1;
    const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return c * dir || a.sid.localeCompare(b.sid);
  });
}
function studentDetail(p) {
  const earned = BADGES.filter(b => toArr(p.badges).includes(b.id)).map(b => b.name);
  const rec = toArr(p.recent).slice(0, 8);
  return `<div class="detail-grid">
  <div><h3>모은 기록</h3><p>${earned.length ? earned.map(esc).join(', ') : '아직 없어요'}</p></div>
  <div><h3>최근 경기</h3>${rec.length ? `<ul class="mini-recent">${rec.map(g => `<li><span class="lvl-chip lv${g.levelId}">${(LEVELS[g.levelId] || {}).name || ''}</span>${esc(g.code || '')} ${g.won ? '<span class="ok">방어 성공</span>' : `${(Number(g.wave) || 0) + 1}웨이브에서 무너짐`} <span class="muted-inline">${fmt(Number(g.score) || 0)}점, ${when(g.t)}</span></li>`).join('')}</ul>` : '<p>아직 없어요</p>'}</div>
</div>`;
}
function studentsTabHTML() {
  const all = studentRows();
  const groups = groupsFrom(all.map(r => r.sid));
  const rows = sortedStudents();
  const { col, dir } = T.sort;
  const head = SCOLS.map(([k, label, al]) => `<th scope="col" class="${al || ''}" aria-sort="${col === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-act="tsort" data-col="${k}">${label}${col === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('');
  const body = rows.map(r => {
    const open = T.open === r.key;
    const cells = [esc(r.sid), esc(r.name), r.finished, r.wins, r.b1 == null ? '-' : fmt(r.b1), r.b2 == null ? '-' : fmt(r.b2), r.b3 == null ? '-' : fmt(r.b3), fmt(r.kills), `${r.badges}/${BADGES.length}`, r.last ? when(r.last) : '-'];
    return `<tr class="row${open ? ' open' : ''}" data-act="trow" data-key="${esc(r.key)}" tabindex="0" aria-expanded="${open}">${cells.map((c, i) => `<td class="${SCOLS[i][2] || ''}">${c}</td>`).join('')}</tr>`
      + (open ? `<tr class="t-detail"><td colspan="${SCOLS.length}">${studentDetail(r.raw)}</td></tr>` : '');
  }).join('');
  return `<div class="filters">${classFilter(groups)}<span class="count-inline">${rows.length}명</span><span class="spacer"></span>
  <button type="button" class="btn" data-act="tcsv"${rows.length ? '' : ' disabled'}>CSV로 내려받기</button></div>
${rows.length
    ? `<section class="panel t-section table-panel"><div class="table-wrap"><table class="t-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></section>
<p class="muted small t-section">줄을 누르면 모은 기록과 최근 경기가 펼쳐져요.</p>`
    : '<p class="muted t-section">아직 기록이 있는 학생이 없어요.</p>'}`;
}

function manageTabHTML() {
  const n = Object.keys(T.players).length;
  return `<div class="t-grid">
  <section class="panel">
    <h2>수업 현황 비우기</h2>
    <p class="muted">‘수업 현황’ 목록만 비워요. 학생 기록은 그대로 남아요. 새 수업을 시작할 때 쓰세요.</p>
    <button type="button" class="btn" data-act="tclearLive">${T.armed === 'live' ? '한 번 더 누르면 현황을 비워요' : '현황 비우기'}</button>
  </section>
  <section class="panel">
    <h2>이 게임의 기록 모두 지우기</h2>
    <p class="muted">소인수 타워 디펜스에 쌓인 학생 ${n}명의 기록과 경기 기록, 수업 현황을 모두 지워요. 다른 게임의 기록은 그대로예요. 되돌릴 수 없으니 학년 말에 정리할 때 쓰세요.</p>
    <div class="field"><label for="tdelIn">확인하려면 ‘삭제’라고 입력하세요</label><input id="tdelIn" autocomplete="off" spellcheck="false"></div>
    <button type="button" class="btn danger" data-act="tclearAll">이 게임의 기록 모두 지우기</button>
    <p class="err" id="tdelErr" role="alert"></p>
    ${T.note ? `<p class="note">${esc(T.note)}</p>` : ''}
  </section>
</div>
<section class="panel t-section">
  <h2>저장 위치</h2>
  <p class="muted">${Net.mode === 'firebase' ? '학급 서버(Firebase)에 저장하고 있어요. 어느 노트북에서 한 경기든 여기로 모여요.' : '이 노트북의 브라우저에 저장하고 있어요. 학급 서버를 연결하면 모든 노트북의 기록이 여기로 모여요.'}</p>
</section>`;
}

/* ----- 동작 ----- */
function showCode(text) {
  const p = parseCode(text || '');
  if (!p) {
    const e = $('#tcodeErr');
    if (e) e.textContent = '경기 코드는 숫자 다섯 자리예요. 예: 2-4821';
    return;
  }
  T.code = formatCode(p.levelId, p.seed);
  T.tab = 'code';
  render();
  watchCode(T.code);
  const r = $('#codeResults');
  if (r && r.scrollIntoView) r.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
}
function armOrRun(kind, run) {
  if (T.armed !== kind) {
    T.armed = kind;
    clearTimeout(T.armTimer);
    T.armTimer = setTimeout(() => { T.armed = null; if (view === 'teacher') renderTeacherBody(); }, 3000);
    renderTeacherBody();
    return;
  }
  T.armed = null;
  clearTimeout(T.armTimer);
  run().then(() => renderTeacherBody()).catch(() => { T.err = '지우지 못했어요. 다시 시도해 주세요.'; renderTeacherBody(); });
}
async function clearEverything() {
  const inp = $('#tdelIn'), err = $('#tdelErr');
  if (!inp || inp.value.trim() !== '삭제') { if (err) err.textContent = '‘삭제’라고 정확히 입력해야 지울 수 있어요.'; return; }
  try {
    await Net.clearAll();
    T.players = {}; T.live = {}; T.games = {}; T.open = null;
    T.note = '모든 기록을 지웠어요.';
    if (Net.mode === 'local') { Net.stopPresence(false); me = null; G.g = null; lastResult = null; store.del(KEY.current); }
    renderTeacherBody();
  } catch (e) {
    if (err) err.textContent = '지우지 못했어요. 선생님 계정과 권한을 확인하고 다시 시도해 주세요.';
  }
}
function downloadCSV() {
  const rows = sortedStudents();
  const head = ['학번', '이름', '경기', '방어 성공', '입문 최고 점수', '기본 최고 점수', '도전 최고 점수', '물리친 몬스터', '모은 기록', '마지막 경기'];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head, ...rows.map(r => [
    r.sid, r.name, r.finished, r.wins, r.b1, r.b2, r.b3, r.kills,
    toArr(r.raw.badges).length, r.last ? new Date(r.last).toLocaleString('ko-KR') : '',
  ])].map(r => r.map(cell).join(','));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const d = new Date();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `소인수타워디펜스_기록_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function onTeacherAct(a) {
  switch (a.dataset.act) {
    case 'tsignin': teacherSignIn(); break;
    case 'tsignout':
      stopTeacherData();
      Net.teacherSignOut().catch(() => {}).then(() => { T.players = {}; T.live = {}; T.games = {}; render(); });
      break;
    case 'ttab': T.tab = a.dataset.tab; T.err = ''; T.note = ''; T.armed = null; render(); break;
    case 'tgenlv': T.genLevel = Number(a.dataset.level); renderTeacherBody(); break;
    case 'tgen': { const code = addTeacherCode(T.genLevel); showCode(code); break; }
    case 'tshow': showCode(a.dataset.code || ($('#tcodeIn') ? $('#tcodeIn').value : '')); break;
    case 'tsort': {
      const c = a.dataset.col;
      T.sort = T.sort.col === c ? { col: c, dir: -T.sort.dir } : { col: c, dir: 1 };
      renderTeacherBody();
      break;
    }
    case 'trow': { const k = a.dataset.key; T.open = T.open === k ? null : k; renderTeacherBody(); break; }
    case 'tcsv': downloadCSV(); break;
    case 'tclearLive': armOrRun('live', () => Net.clearLive()); break;
    case 'tclearAll': clearEverything(); break;
    default: break;
  }
}

document.addEventListener('change', e => {
  if (e.target.id !== 'tcls') return;
  T.cls = e.target.value;
  T.open = null;
  if (T.tab === 'code') renderCodeResults(); else renderTeacherBody();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="trow"]')) {
    e.preventDefault();
    onTeacherAct(e.target);
  }
});

/* ===== 시작 ===== */
function boot() {
  restorePlayer();
  if (location.hash === '#teacher') view = 'teacher';
  applyBig();
  render();
  Net.onStatus(() => {
    updateFoot();
    if (view === 'teacher') { render(); startTeacherData(); }
  });
  window.addEventListener('pagehide', () => { if (me && Net.mode === 'local') Net.stopPresence(true); });
  window.addEventListener('hashchange', () => { if (location.hash === '#teacher' && view !== 'teacher') openTeacher(); });
  Net.boot();
  syncAfterBoot();
  Net.ready.then(() => Net.watchHub(v => {
    const before = closedByTeacher();
    hubState = v;
    if (closedByTeacher() !== before && view !== 'teacher') render();
  }));
  if (view === 'teacher') startTeacherData();
}
boot();
</script>
</body>
</html>
