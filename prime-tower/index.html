    <div class="actions"><button type="button" class="btn primary" data-act="tgen">새 코드 만들기</button></div>
    ${made}
  </section>
  <section class="panel">
    <h2><label for="tcodeIn">경기 코드 결과 보기</label></h2>
    <p class="muted small">학생들이 알려 준 코드나 직접 만든 코드를 넣으면, 그 코드로 끝낸 경기가 실시간으로 모여요.</p>
    <div class="inline-row"><input id="tcodeIn" class="code-in" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="8" placeholder="예: 2-3-4821" value="${esc(T.code)}"><button type="button" class="btn" data-act="tshow">보기</button></div>
    <p class="err" id="tcodeErr" role="alert"></p>
  </section>
</div>
<div id="codeResults">${codeResultsHTML()}</div>`;
}

function codeResultsHTML() {
  if (!T.code) return '';
  const p = parseCode(T.code);
  if (!p) return '';
  const all = Object.values(T.games).filter(g => g && g.code === T.code && typeof g.sid === 'string');
  const W = STAGES[p.stageId].waves;
  const first = new Map();
  all.slice().sort((a, b) => (Number(a.t) || 0) - (Number(b.t) || 0)).forEach(g => {
    const k = g.key || keyOf(g.sid, g.name || '');
    if (!first.has(k)) first.set(k, g);
  });
  const groups = groupsFrom([...first.values()].map(g => g.sid));
  const rows = [...first.values()].filter(g => inCls(g.sid));
  const wins = rows.filter(g => g.won);
  const reached = g => (g.won ? W : Math.min(W, (Number(g.wave) || 0) + 1));
  const avgWave = rows.length ? (rows.reduce((s, g) => s + reached(g), 0) / rows.length).toFixed(1) : '-';
  const best = rows.length ? fmt(Math.max(...rows.map(g => Number(g.score) || 0))) : '-';
  const buckets = Array(W + 1).fill(0);
  rows.forEach(g => { buckets[g.won ? W : reached(g) - 1] += 1; });
  const top = Math.max(1, ...buckets);
  const hist = buckets.map((n, i) => `<div class="hbar${i === W ? ' goal' : ''}"><span class="hcnt led">${n || ''}</span><span class="track"><span class="bar" style="height:${n ? Math.max(4, Math.round(n / top * 100)) : 0}%"></span></span><span class="htick">${i === W ? '성공' : i + 1}</span></div>`).join('');
  const ranked = rows.slice().sort((a, b) => ((Number(b.score) || 0) - (Number(a.score) || 0)) || ((Number(a.t) || 0) - (Number(b.t) || 0)));
  const list = ranked.length
    ? `<ol class="rank">${ranked.map((g, i) => `<li><span class="rk">${i + 1}</span><span class="lv-sid">${esc(g.sid)}</span><span class="lv-name">${esc(g.name || '')}</span><span class="${g.won ? 'ok' : 'muted-inline'}">${g.won ? `방어 성공, 목숨 ${Number(g.lives)}` : `${reached(g)}웨이브에서 무너짐`}</span><span class="lv-score">${fmt(Number(g.score) || 0)}점</span><span class="lv-time">${clock(g.t)}</span></li>`).join('')}</ol>`
    : '<p class="muted">아직 이 코드로 끝낸 경기가 없어요.</p>';
  return `<section class="board t-board">
  <div class="rec-head"><span class="lvl-chip lv${p.levelId}">${p.stageId} ${STAGES[p.stageId].title}</span><h2 class="code-title led">${T.code}</h2></div>
  <div class="plates four">
    <div class="plate"><span class="lbl">참가</span><span class="led val">${rows.length}</span></div>
    <div class="plate"><span class="lbl">방어 성공</span><span class="led val">${wins.length}</span></div>
    <div class="plate"><span class="lbl">평균 도달 웨이브</span><span class="led val">${avgWave}</span></div>
    <div class="plate"><span class="lbl">최고 점수</span><span class="led val">${best}</span></div>
  </div>
  <p class="hist-cap">몇 웨이브에서 무너졌는지, 끝까지 막았는지</p>
  <div class="hist" style="grid-template-columns: repeat(${W + 1}, minmax(0, 1fr))" role="img" aria-label="무너진 웨이브별 인원과 방어 성공 인원">${hist}</div>
</section>
<section class="panel t-section">
  <div class="filters"><h2>학생별 결과</h2><span class="spacer"></span>${classFilter(groups)}</div>
  <p class="muted small">같은 코드로 여러 번 한 학생은 첫 경기만 셉니다.</p>
  ${list}
</section>`;
}

const SCOLS = [
  ['sid', '학번', 'l'], ['name', '이름', 'l'], ['finished', '경기'], ['wins', '방어 성공'],
  ['cleared', '깬 단계'], ['stars', '별'], ['kills', '물리친 몬스터'], ['badges', '모은 기록'], ['last', '마지막 경기'],
];
function studentRows() {
  return Object.values(T.players).filter(p => p && typeof p.sid === 'string').map(p => {
    const st = p.st && typeof p.st === 'object' ? p.st : {};
    const last = toArr(p.recent).reduce((m, g) => Math.max(m, Number(g && g.t) || 0), 0);
    return {
      key: p.key || keyOf(p.sid, String(p.name || '')), sid: p.sid, name: String(p.name || ''),
      finished: Number(p.finished) || 0, wins: Number(p.wins) || 0, kills: Number(p.kills) || 0,
      cleared: STAGE_IDS.filter(id => st[id] && Number(st[id].w) > 0).length,
      stars: STAGE_IDS.reduce((a, id) => a + Math.min(3, Number(st[id] && st[id].stars) || 0), 0),
      badges: toArr(p.badges).length, last: last || null, raw: p,
    };
  });
}
function sortedStudents() {
  const rows = studentRows().filter(r => inCls(r.sid));
  const { col, dir } = T.sort;
  return rows.sort((a, b) => {
    const va = a[col], vb = b[col];
    if (va == null && vb == null) return a.sid.localeCompare(b.sid);
    if (va == null) return 1;
    if (vb == null) return -1;
    const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return c * dir || a.sid.localeCompare(b.sid);
  });
}
function studentDetail(p) {
  const earned = BADGES.filter(b => toArr(p.badges).includes(b.id)).map(b => b.name);
  const rec = toArr(p.recent).slice(0, 8);
  const st = p.st && typeof p.st === 'object' ? p.st : {};
  const grid = [1, 2, 3].map(lv => `<p class="small">${MAPS[LEVELS[lv].map].name}: ${STAGE_IDS.filter(id => STAGES[id].level === lv).map(id => `${id} ${st[id] && Number(st[id].w) > 0 ? '★'.repeat(Math.min(3, Number(st[id].stars) || 0)) || '성공' : '-'}`).join(', ')}</p>`).join('');
  return `<div class="detail-grid">
  <div><h3>단계별 별</h3>${grid}<h3>모은 기록</h3><p>${earned.length ? earned.map(esc).join(', ') : '아직 없어요'}</p></div>
  <div><h3>최근 경기</h3>${rec.length ? `<ul class="mini-recent">${rec.map(g => `<li><span class="lvl-chip lv${g.levelId}">${esc(g.stageId || '')}</span>${esc(g.code || '')} ${g.won ? '<span class="ok">방어 성공</span>' : `${(Number(g.wave) || 0) + 1}웨이브에서 무너짐`} <span class="muted-inline">${fmt(Number(g.score) || 0)}점, ${when(g.t)}</span></li>`).join('')}</ul>` : '<p>아직 없어요</p>'}</div>
</div>`;
}
function studentsTabHTML() {
  const all = studentRows();
  const groups = groupsFrom(all.map(r => r.sid));
  const rows = sortedStudents();
  const { col, dir } = T.sort;
  const head = SCOLS.map(([k, label, al]) => `<th scope="col" class="${al || ''}" aria-sort="${col === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-act="tsort" data-col="${k}">${label}${col === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('');
  const body = rows.map(r => {
    const open = T.open === r.key;
    const cells = [esc(r.sid), esc(r.name), r.finished, r.wins, `${r.cleared}/15`, `${r.stars}/45`, fmt(r.kills), `${r.badges}/${BADGES.length}`, r.last ? when(r.last) : '-'];
    return `<tr class="row${open ? ' open' : ''}" data-act="trow" data-key="${esc(r.key)}" tabindex="0" aria-expanded="${open}">${cells.map((c, i) => `<td class="${SCOLS[i][2] || ''}">${c}</td>`).join('')}</tr>`
      + (open ? `<tr class="t-detail"><td colspan="${SCOLS.length}">${studentDetail(r.raw)}</td></tr>` : '');
  }).join('');
  return `<div class="filters">${classFilter(groups)}<span class="count-inline">${rows.length}명</span><span class="spacer"></span>
  <button type="button" class="btn" data-act="tcsv"${rows.length ? '' : ' disabled'}>CSV로 내려받기</button></div>
${rows.length
    ? `<section class="panel t-section table-panel"><div class="table-wrap"><table class="t-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></section>
<p class="muted small t-section">줄을 누르면 모은 기록과 최근 경기가 펼쳐져요.</p>`
    : '<p class="muted t-section">아직 기록이 있는 학생이 없어요.</p>'}`;
}

function manageTabHTML() {
  const n = Object.keys(T.players).length;
  return `<div class="t-grid">
  <section class="panel">
    <h2>수업 현황 비우기</h2>
    <p class="muted">‘수업 현황’ 목록만 비워요. 학생 기록은 그대로 남아요. 새 수업을 시작할 때 쓰세요.</p>
    <button type="button" class="btn" data-act="tclearLive">${T.armed === 'live' ? '한 번 더 누르면 현황을 비워요' : '현황 비우기'}</button>
  </section>
  <section class="panel">
    <h2>이 게임의 기록 모두 지우기</h2>
    <p class="muted">소인수 타워 디펜스에 쌓인 학생 ${n}명의 기록과 경기 기록, 수업 현황을 모두 지워요. 다른 게임의 기록은 그대로예요. 되돌릴 수 없으니 학년 말에 정리할 때 쓰세요.</p>
    <div class="field"><label for="tdelIn">확인하려면 ‘삭제’라고 입력하세요</label><input id="tdelIn" autocomplete="off" spellcheck="false"></div>
    <button type="button" class="btn danger" data-act="tclearAll">이 게임의 기록 모두 지우기</button>
    <p class="err" id="tdelErr" role="alert"></p>
    ${T.note ? `<p class="note">${esc(T.note)}</p>` : ''}
  </section>
</div>
<section class="panel t-section">
  <h2>저장 위치</h2>
  <p class="muted">${Net.mode === 'firebase' ? '학급 서버(Firebase)에 저장하고 있어요. 어느 노트북에서 한 경기든 여기로 모여요.' : '이 노트북의 브라우저에 저장하고 있어요. 학급 서버를 연결하면 모든 노트북의 기록이 여기로 모여요.'}</p>
</section>`;
}

/* ----- 동작 ----- */
function showCode(text) {
  const p = parseCode(text || '');
  if (!p) {
    const e = $('#tcodeErr');
    if (e) e.textContent = '경기 코드는 숫자 여섯 자리예요. 예: 2-3-4821';
    return;
  }
  T.code = formatCode(p.stageId, p.seed);
  T.tab = 'code';
  render();
  watchCode(T.code);
  const r = $('#codeResults');
  if (r && r.scrollIntoView) r.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
}
function armOrRun(kind, run) {
  if (T.armed !== kind) {
    T.armed = kind;
    clearTimeout(T.armTimer);
    T.armTimer = setTimeout(() => { T.armed = null; if (view === 'teacher') renderTeacherBody(); }, 3000);
    renderTeacherBody();
    return;
  }
  T.armed = null;
  clearTimeout(T.armTimer);
  run().then(() => renderTeacherBody()).catch(() => { T.err = '지우지 못했어요. 다시 시도해 주세요.'; renderTeacherBody(); });
}
async function clearEverything() {
  const inp = $('#tdelIn'), err = $('#tdelErr');
  if (!inp || inp.value.trim() !== '삭제') { if (err) err.textContent = '‘삭제’라고 정확히 입력해야 지울 수 있어요.'; return; }
  try {
    await Net.clearAll();
    T.players = {}; T.live = {}; T.games = {}; T.open = null;
    T.note = '모든 기록을 지웠어요.';
    if (Net.mode === 'local') { Net.stopPresence(false); me = null; G.g = null; lastResult = null; store.del(KEY.current); }
    renderTeacherBody();
  } catch (e) {
    if (err) err.textContent = '지우지 못했어요. 선생님 계정과 권한을 확인하고 다시 시도해 주세요.';
  }
}
function downloadCSV() {
  const rows = sortedStudents();
  const head = ['학번', '이름', '경기', '방어 성공', '깬 단계', '별', '물리친 몬스터', '모은 기록', '마지막 경기', ...STAGE_IDS.map(id => id + ' 별')];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head, ...rows.map(r => [
    r.sid, r.name, r.finished, r.wins, r.cleared, r.stars, r.kills,
    toArr(r.raw.badges).length, r.last ? new Date(r.last).toLocaleString('ko-KR') : '',
    ...STAGE_IDS.map(id => { const v = r.raw.st && r.raw.st[id]; return v && Number(v.f) ? Math.min(3, Number(v.stars) || 0) : ''; }),
  ])].map(r => r.map(cell).join(','));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const d = new Date();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `소인수타워디펜스_기록_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function onTeacherAct(a) {
  switch (a.dataset.act) {
    case 'tsignin': teacherSignIn(); break;
    case 'tsignout':
      stopTeacherData();
      Net.teacherSignOut().catch(() => {}).then(() => { T.players = {}; T.live = {}; T.games = {}; T.rooms = null; Net.useRoom(null); render(); });
      break;
    case 'ttab': T.tab = a.dataset.tab; T.err = ''; T.note = ''; T.armed = null; render(); break;
    case 'tgenmap': T.genMap = Number(a.dataset.map); renderTeacherBody(); break;
    case 'tgenno': T.genNo = Number(a.dataset.no); renderTeacherBody(); break;
    case 'tgen': { const code = addTeacherCode(T.genMap + '-' + T.genNo); showCode(code); break; }
    case 'tshow': showCode(a.dataset.code || ($('#tcodeIn') ? $('#tcodeIn').value : '')); break;
    case 'tsort': {
      const c = a.dataset.col;
      T.sort = T.sort.col === c ? { col: c, dir: -T.sort.dir } : { col: c, dir: 1 };
      renderTeacherBody();
      break;
    }
    case 'trow': { const k = a.dataset.key; T.open = T.open === k ? null : k; renderTeacherBody(); break; }
    case 'tcsv': downloadCSV(); break;
    case 'tclearLive': armOrRun('live', () => Net.clearLive()); break;
    case 'tclearAll': clearEverything(); break;
    default: break;
  }
}

document.addEventListener('change', e => {
  if (e.target.id !== 'tcls') return;
  T.cls = e.target.value;
  T.open = null;
  if (T.tab === 'code') renderCodeResults(); else renderTeacherBody();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="trow"]')) {
    e.preventDefault();
    onTeacherAct(e.target);
  }
});

/* ===== 시작 ===== */
function boot() {
  restorePlayer();
  if (location.hash === '#teacher') view = 'teacher';
  applyBig();
  render();
  Net.onStatus(() => {
    updateFoot();
    if (view === 'teacher') { render(); startTeacherData(); }
  });
  window.addEventListener('pagehide', () => { if (me && Net.mode === 'local') Net.stopPresence(true); });
  window.addEventListener('hashchange', () => { if (location.hash === '#teacher' && view !== 'teacher') openTeacher(); });
  Net.boot();
  syncAfterBoot();
  Net.ready.then(() => Net.watchHub(v => {
    const before = closedByTeacher();
    hubState = v;
    if (closedByTeacher() !== before && view !== 'teacher') render();
  }));
  if (view === 'teacher') startTeacherData();
}
boot();
</script>
</body>
</html>
