<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>최대공약수 숫자야구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Sunflower:wght@300;500;700&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --field: #e9f0e5;
  --stripe: rgba(38, 104, 58, 0.055);
  --chalk: #ffffff;
  --chalk-2: #f3f7f0;
  --ink: #15233b;
  --ink-soft: #56637b;
  --line: #cdd9c9;
  --edge: #15233b;
  --input-edge: #95a6bf;
  --red: #cf3328;
  --red-ink: #ffffff;
  --red-soft: rgba(207, 51, 40, 0.1);
  --green: #25703f;
  --green-soft: rgba(37, 112, 63, 0.12);
  --navy-soft: rgba(21, 35, 59, 0.08);
  /* 전광판은 실제 물건처럼 밝기 설정과 상관없이 같은 색 */
  --board: #10231a;
  --board-deep: #0a1711;
  --board-line: #264335;
  --board-text: #eaf3ec;
  --board-soft: #9ab4a3;
  --led: #ffb627;
  --led-glow: rgba(255, 170, 40, 0.5);
  --font: 'Sunflower', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-led: 'DotGothic16', 'Consolas', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --field: #0e1627;
    --stripe: rgba(125, 160, 255, 0.04);
    --chalk: #16213a;
    --chalk-2: #1c2946;
    --ink: #edf1f8;
    --ink-soft: #a5b0c6;
    --line: #2b3a5e;
    --edge: #050912;
    --input-edge: #3d5080;
    --red: #df4639;
    --red-ink: #ffffff;
    --red-soft: rgba(239, 90, 75, 0.16);
    --green: #62c787;
    --green-soft: rgba(98, 199, 135, 0.16);
    --navy-soft: rgba(237, 241, 248, 0.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --field: #0e1627;
  --stripe: rgba(125, 160, 255, 0.04);
  --chalk: #16213a;
  --chalk-2: #1c2946;
  --ink: #edf1f8;
  --ink-soft: #a5b0c6;
  --line: #2b3a5e;
  --edge: #050912;
  --input-edge: #3d5080;
  --red: #df4639;
  --red-ink: #ffffff;
  --red-soft: rgba(239, 90, 75, 0.16);
  --green: #62c787;
  --green-soft: rgba(98, 199, 135, 0.16);
  --navy-soft: rgba(237, 241, 248, 0.08);
}

*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html.big { font-size: 125%; }
body {
  margin: 0;
  background-color: var(--field);
  background-image: repeating-linear-gradient(90deg, var(--stripe) 0 4.5rem, transparent 4.5rem 9rem);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.6;
}
button, input { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap {
  width: 100%;
  max-width: 72rem;
  margin: 0 auto;
  padding-left: max(1rem, env(safe-area-inset-left, 0px));
  padding-right: max(1rem, env(safe-area-inset-right, 0px));
}
main.wrap { padding-bottom: 3rem; }
.topbar { display: flex; align-items: center; gap: .6rem .9rem; padding-top: .9rem; padding-bottom: .7rem; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.pill {
  font-weight: 500; font-size: .95rem; line-height: 1;
  padding: .55rem .9rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--chalk); color: var(--ink); cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
.me-chip { display: inline-flex; align-items: baseline; gap: .45rem; font-weight: 700; }
.me-chip .no { font-family: var(--font-led); font-weight: 400; color: var(--ink-soft); }

h1, h2, h3 { letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 .3rem; line-height: 1.3; }
h2 label { cursor: pointer; }
.page-title { font-size: 1.95rem; font-weight: 700; margin: 0 0 .3rem; line-height: 1.2; }
.muted { color: var(--ink-soft); margin: .1rem 0 .9rem; }
.small { font-size: .9rem; line-height: 1.5; }
p { max-width: 44rem; text-wrap: pretty; }
dd { text-wrap: pretty; }
.board-sub, .result-line, .hero-sub { text-wrap: balance; }

/* ===== 전광판 ===== */
.board {
  position: relative;
  overflow: hidden;
  margin: 6px;
  padding: 1.1rem clamp(.9rem, 2.6vw, 1.6rem) 1.2rem;
  border-radius: 20px;
  color: var(--board-text);
  background-color: var(--board);
  background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.4px);
  background-size: 6px 6px;
  box-shadow: inset 0 0 0 1px var(--board-line), 0 0 0 6px var(--board-deep), 0 22px 40px -24px rgba(0, 0, 0, .65);
}
.led {
  font-family: var(--font-led);
  font-weight: 400;
  color: var(--led);
  text-shadow: 0 0 .35em var(--led-glow), 0 0 1.2em rgba(255, 140, 20, .22);
}
.led.flash { animation: flash .7s ease-out 1; }
@keyframes flash {
  0% { color: #fff6d6; text-shadow: 0 0 .6em rgba(255, 214, 130, .95), 0 0 2em rgba(255, 150, 30, .6); }
  100% { color: var(--led); }
}
.board-sub { color: var(--board-soft); margin: .8rem auto 0; }
.board-link {
  background: none; border: 0; padding: .3rem 0; cursor: pointer;
  color: var(--board-soft); font-weight: 500; font-size: .95rem;
  text-decoration: underline; text-underline-offset: .2em;
}
.board-link:hover { color: var(--board-text); }
.board-foot { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem .8rem; margin-top: .85rem; }

.ls-wrap {
  margin-top: .9rem;
  overflow-x: auto;
  border-radius: 12px;
  background: var(--board-deep);
  box-shadow: inset 0 0 0 1px var(--board-line);
}
.ls { border-collapse: separate; border-spacing: 0; width: 100%; }
.ls th, .ls td { padding: .5rem .6rem; text-align: center; white-space: nowrap; border-right: 1px solid var(--board-line); }
.ls tr > :last-child { border-right: 0; }
.ls thead th { font-weight: 300; font-size: .85rem; color: var(--board-soft); border-bottom: 1px solid var(--board-line); }
.ls tbody tr:first-child > * { border-bottom: 1px solid var(--board-line); }
.ls th[scope="row"], .ls thead th:first-child {
  position: sticky; left: 0; z-index: 1;
  background: var(--board-deep); text-align: left; font-weight: 500; color: var(--board-soft); min-width: 4.6rem;
}
.ls td { font-family: var(--font-led); color: var(--led); text-shadow: 0 0 .35em var(--led-glow); font-size: 1.35rem; min-width: 3rem; }
.ls td.empty { color: rgba(255, 182, 39, .2); text-shadow: none; }
.ls td.now { background: rgba(255, 182, 39, .1); }
.ls td.hr { color: #fff1c2; }

.plate {
  background: var(--board-deep); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--board-line);
  padding: .6rem .8rem .85rem; text-align: center; display: grid; gap: .3rem; align-content: start;
}
.plate .lbl { color: var(--board-soft); font-size: .95rem; }
.plates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-top: 1.1rem; }
.plates.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 34rem) { .plates.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.plates .val { font-size: 1.45rem; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.plates .led.val { font-weight: 400; }

/* 첫 화면 */
.hero { padding-top: 1.35rem; }
.hero-head { display: flex; gap: 1rem; align-items: center; }
.hero-ball { width: clamp(3rem, 9vw, 4.6rem); height: auto; flex: none; }
.hero-title { margin: 0; font-size: clamp(1.9rem, 5.2vw, 3.05rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: var(--board-text); }
.hero-sub { margin: .4rem 0 0; color: var(--board-soft); font-weight: 300; font-size: 1.05rem; }
.hero .ls td { font-size: 1.5rem; }
.demo-cap { margin: 0; color: var(--board-soft); flex: 1 1 16rem; }

.player {
  margin: 1.1rem 6px 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: .7rem 1.1rem;
  background: var(--chalk); border: 1px solid var(--line); border-radius: 16px; padding: .85rem 1rem;
}
.player-no {
  font-family: var(--font-led); font-weight: 400; color: var(--led); background: var(--board);
  border-radius: 10px; padding: .3rem .7rem; font-size: 1.35rem; line-height: 1.2;
  text-shadow: 0 0 .35em var(--led-glow); box-shadow: inset 0 0 0 1px var(--board-line);
}
.player-name { font-size: 1.35rem; font-weight: 700; }
.player-stats { display: flex; gap: .3rem 1rem; flex-wrap: wrap; color: var(--ink-soft); }
.player-stats b { color: var(--ink); font-size: 1.1rem; margin-left: .3rem; }
.player .spacer { flex: 1; }
.player-actions { display: flex; gap: .6rem 1rem; align-items: center; flex-wrap: wrap; }

.resume {
  margin: 1.1rem 6px 0;
  display: flex; flex-wrap: wrap; gap: .7rem 1rem; align-items: center; justify-content: space-between;
  background: var(--green-soft); border: 1px solid var(--green); border-radius: 14px; padding: .8rem 1rem;
}
.resume p { margin: 0; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; margin: 1.25rem 6px 0; }
@media (min-width: 52rem) { .home-grid { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.stack { display: grid; gap: 1rem; align-content: start; }
.panel { background: var(--chalk); border: 1px solid var(--line); border-radius: 16px; padding: 1.15rem 1.25rem 1.25rem; }
.blurb { margin: .8rem 0 0; }
.rules { margin: .8rem 0 1.1rem; display: grid; gap: .45rem; }
.rules div { display: grid; grid-template-columns: 7rem 1fr; gap: .6rem; }
.rules dt { color: var(--ink-soft); }
.rules dd { margin: 0; }
@media (max-width: 30rem) { .rules div { grid-template-columns: 1fr; gap: 0; } }
.steps { margin: .5rem 0 0; padding-left: 1.4rem; display: grid; gap: .45rem; }
.steps li { padding-left: .2rem; }
.steps li::marker { font-family: var(--font-led); color: var(--red); }

.field { display: grid; gap: .3rem; margin-bottom: .85rem; }
.field label { font-weight: 700; font-size: 1.05rem; }
.field input, .code-in, .guess-in {
  font-weight: 700; font-size: 1.4rem; line-height: 1.2; letter-spacing: .03em;
  padding: .6rem .85rem; border-radius: 12px;
  border: 2px solid var(--input-edge); background: var(--chalk-2); color: var(--ink);
}
.field input { width: 100%; }
.field input:focus, .code-in:focus, .guess-in:focus { outline: 3px solid var(--green); outline-offset: 1px; border-color: var(--green); }
.field input::placeholder, .code-in::placeholder, .guess-in::placeholder { color: var(--ink-soft); opacity: .6; font-weight: 500; }
.guess-in { font-size: 1.8rem; }
.signin .btn.wide { margin-top: .3rem; }
.signin .btn.wide + .muted { margin: .9rem 0 0; }

.ticket {
  display: grid; grid-template-columns: 1fr 3.1rem;
  background: var(--chalk); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.ticket-main { padding: 1.15rem 1.25rem 1rem; min-width: 0; }
.ticket-stub {
  writing-mode: vertical-rl;
  display: flex; align-items: center; justify-content: center;
  background: var(--red); color: var(--red-ink);
  font-weight: 700; letter-spacing: .35em; font-size: 1rem;
  border-left: 2px dashed var(--chalk);
}

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--chalk-2); border: 1px solid var(--line); }
.seg button { font-weight: 700; font-size: 1.05rem; line-height: 1; padding: .65rem 1.05rem; border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--chalk); }

.btn {
  font-weight: 700; font-size: 1.1rem; line-height: 1.1;
  padding: .8rem 1.15rem; border-radius: 12px;
  border: 2px solid var(--edge); background: var(--chalk-2); color: var(--ink);
  box-shadow: 0 3px 0 var(--edge); cursor: pointer; white-space: nowrap;
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: var(--red); color: var(--red-ink); }
.btn.wide { width: 100%; font-size: 1.35rem; padding: 1rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn .cost { font-weight: 500; font-size: .85rem; margin-left: .45rem; color: var(--red); }
.btn.on-board { background: transparent; color: var(--board-text); border-color: var(--board-line); box-shadow: 0 3px 0 #000; }
.text-btn {
  background: none; border: 0; padding: .35rem .1rem; cursor: pointer;
  font-weight: 500; font-size: .95rem; line-height: 1.2; color: var(--ink-soft);
  text-decoration: underline; text-underline-offset: .2em;
}
.text-btn:disabled { opacity: .45; cursor: default; }
.text-btn.danger { color: var(--red); }
.text-btn.danger.armed { font-weight: 700; text-decoration: none; background: var(--red-soft); padding: .45rem .7rem; border-radius: 8px; }

.inline-row { display: flex; gap: .5rem; align-items: stretch; flex-wrap: wrap; }
.inline-row input { flex: 1 1 8rem; min-width: 0; }
.err { color: var(--red); min-height: 1.5em; margin: .45rem 0 0; font-weight: 500; }

/* ===== 경기 화면 ===== */
.game-head { display: flex; gap: .5rem .8rem; align-items: center; flex-wrap: wrap; margin: 0 6px; }
.lvl-chip { display: inline-block; font-weight: 700; padding: .2rem .75rem; border-radius: 999px; font-size: .95rem; line-height: 1.4; }
.lvl-chip.lv1 { background: var(--green-soft); color: var(--green); }
.lvl-chip.lv2 { background: var(--navy-soft); color: var(--ink); }
.lvl-chip.lv3 { background: var(--red-soft); color: var(--red); }
.code-chip { color: var(--ink-soft); }
.code-chip b { color: var(--ink); margin-left: .2rem; letter-spacing: .03em; }

.game-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; margin-top: .75rem; }
.col-main { min-width: 0; }
@media (min-width: 56rem) { .game-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.readout { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .6rem; align-items: stretch; }
.led.big { font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; }
.sep { align-self: center; font-size: 1.3rem; opacity: .5; }
.board-msg { margin: .85rem 0 0; min-height: 1.6em; font-size: 1.05rem; }
.count-lbl { color: var(--board-soft); }
.count { font-size: 1.9rem; line-height: 1; }
.count-sub { color: var(--board-soft); font-size: .9rem; }

.guess-box { margin: 1rem 6px 0; }
.guess-label { display: block; font-weight: 700; font-size: 1.1rem; margin-bottom: .35rem; }
.guess-box .btn { font-size: 1.25rem; padding: .8rem 1.4rem; }
.guess-box .muted { margin-bottom: .4rem; }

.memo { margin: 0 6px; }
.memo-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.memo-count { color: var(--ink-soft); }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.75rem, 1fr)); gap: .4rem; margin-top: .4rem; }
.num {
  position: relative; min-height: 2.6rem; padding: .5rem 0;
  font-weight: 700; font-size: 1.05rem; line-height: 1;
  border-radius: 10px; border: 1px solid var(--line); background: var(--chalk-2); color: var(--ink); cursor: pointer;
}
.num:hover:not(:disabled) { border-color: var(--ink-soft); }
.num.x, .num.auto, .num.called { color: var(--ink-soft); background: transparent; }
.num.x::after, .num.auto::after, .num.called::after {
  content: ''; position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; border-radius: 2px;
  background: var(--red); transform: rotate(-24deg);
}
.num.auto { opacity: .45; border-style: dashed; cursor: default; }
.num.auto::after { background: var(--ink-soft); }
.num.called { opacity: .6; cursor: default; }
.num.called::after { background: var(--ink); }
.num.revived { border-color: var(--green); box-shadow: 0 0 0 2px var(--green); animation: revive 1.6s ease-out 1; }
@keyframes revive { 0% { transform: scale(1.12); } 40% { transform: scale(1); } }
.num.sel { background: var(--red); color: var(--red-ink); border-color: var(--red); }
.memo-actions { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-top: 1rem; }
.memo-actions + .muted { margin: .7rem 0 0; }
.memo-note { min-height: 1.5em; margin: .5rem 0 0; color: var(--green); font-weight: 700; }

/* ===== 결과 화면 ===== */
.result-board { text-align: center; padding-top: 1.6rem; }
.result-title {
  margin: 0; font-size: clamp(3rem, 13vw, 6rem); line-height: 1; font-weight: 700; letter-spacing: -0.02em;
  color: var(--led); text-shadow: 0 0 .25em var(--led-glow), 0 0 1em rgba(255, 140, 20, .3);
}
.result-board:not(.won) .result-title { color: var(--board-soft); text-shadow: none; }
.result-line { margin: .7rem auto 0; font-size: 1.2rem; }
.result-board .ls-wrap { text-align: left; }
.fly-ball { position: absolute; width: 3.2rem; left: 0; bottom: 0; pointer-events: none; animation: fly 1.7s cubic-bezier(.2, .7, .3, 1) .2s 1 both; }
@keyframes fly {
  0% { transform: translate(-3rem, 2rem) rotate(0deg) scale(.7); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translate(min(80vw, 58rem), -15rem) rotate(900deg) scale(1.1); opacity: 0; }
}
.result-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; margin: 1.25rem 6px 0; }
@media (min-width: 56rem) { .result-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.secret-line { font-size: 1.25rem; margin: .4rem 0 .2rem; }
.plays { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; gap: .45rem; }
.plays li { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; align-items: baseline; padding: .55rem .7rem; border-radius: 12px; background: var(--chalk-2); }
.plays li.win { background: var(--red-soft); }
.play-n { font-family: var(--font-led); color: var(--ink-soft); font-size: 1.1rem; text-align: center; }
.play-body { display: flex; flex-wrap: wrap; gap: .15rem 1rem; align-items: baseline; }
.fx { font-size: 1.1rem; }
.res { color: var(--ink-soft); }
.plays li.win .res { color: var(--red); font-weight: 700; }
mark { background: var(--green-soft); color: var(--green); font-weight: 700; border-radius: 6px; padding: 0 .18em; }
sup { font-size: .7em; line-height: 0; }
.insight { margin: 1rem 0 0; padding: .75rem .95rem; background: var(--chalk-2); border-radius: 12px; }
.tip { font-size: 1.15rem; margin: .3rem 0 0; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }

.badges { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .5rem; }
.badge { display: flex; gap: .6rem; align-items: center; padding: .55rem .7rem; border-radius: 12px; border: 1px dashed var(--line); color: var(--ink-soft); }
.badge.on { border: 1px solid var(--green); background: var(--green-soft); color: var(--ink); }
.mini-ball { width: 1.7rem; height: 1.7rem; display: block; flex: none; opacity: .3; filter: grayscale(1); }
.badge.on .mini-ball { opacity: 1; filter: none; }
.bn { display: block; font-weight: 700; }
.bd { display: block; font-size: .82rem; color: var(--ink-soft); line-height: 1.35; }
.badge-group h3 { font-size: 1.05rem; margin: 1rem 0 0; display: flex; gap: .5rem; align-items: baseline; }
.badge-group h3 .cnt { color: var(--ink-soft); font-weight: 500; font-size: .9rem; }

/* ===== 기록실 ===== */
.rec-head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.rec-title { margin: 0; font-size: clamp(1.6rem, 4.4vw, 2.4rem); font-weight: 700; line-height: 1.15; color: var(--board-text); }

<!-- 여러 게임이 함께 쓰는 학급 서버 설정. 파일이 없으면 이 노트북에만 저장합니다. -->
<script src="../firebase-config.js"></script>
<script>
/* ============================================================
   학급 서버(Firebase) 설정
   - 저장소 맨 위의 firebase-config.js에 적은 설정을 모든 게임이 함께 씁니다.
     이 파일은 고치지 않아도 됩니다.
   - Firebase Hosting에 올린 경우에는 설정을 자동으로 읽어 옵니다.
   - 학급 서버에 닿지 않으면 게임은 이 노트북에만 기록을 저장하며 그대로 진행됩니다.
   ============================================================ */
const FIREBASE_CONFIG = window.CLASS_FIREBASE_CONFIG || null;
const APP_ID = 'gcdbb';                  /* 학급 서버에서 이 게임의 기록이 들어가는 칸 이름 */
/* 이 게임이 들어 있는 폴더 이름. 게임 목록에서 선생님이 게임을 열고 닫을 때 이 이름을 씁니다. */
const GAME_SLUG = (() => {
  const parts = location.pathname.split('/').filter(Boolean);
  if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
  try { return parts.length ? decodeURIComponent(parts[parts.length - 1]) : ''; } catch (e) { return ''; }
})();
const FIREBASE_SDK_BASE = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* ===== 게임 규칙과 계산 (DOM 없음) ===== */
const LEVELS = {
  1: { id: 1, name: '입문', max: 30, cap: 30 },
  2: { id: 2, name: '기본', max: 100, cap: 100 },
  3: { id: 3, name: '도전', max: 300, cap: 300 },
};

function gcd(a, b) { while (b) { const t = a % b; a = b; b = t; } return a; }

function isSmooth7(n) {
  for (const p of [2, 3, 5, 7]) while (n % p === 0) n /= p;
  return n === 1;
}

const _cands = {};
function candidates(levelId) {
  if (!_cands[levelId]) {
    const out = [];
    for (let n = 2; n <= LEVELS[levelId].max; n++) if (isSmooth7(n)) out.push(n);
    _cands[levelId] = out;
  }
  return _cands[levelId];
}

function factorize(n) {
  const out = [];
  let m = n;
  for (let p = 2; p * p <= m; p++) {
    if (m % p === 0) {
      let e = 0;
      while (m % p === 0) { m /= p; e++; }
      out.push([p, e]);
    }
  }
  if (m > 1) out.push([m, 1]);
  return out;
}

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return h >>> 0;
}

function pad4(seed) { return String(seed).padStart(4, '0'); }

function secretFor(levelId, seed) {
  const c = candidates(levelId);
  return c[hash32('gcdbb:v1:' + levelId + ':' + pad4(seed)) % c.length];
}

function formatCode(levelId, seed) { return levelId + '-' + pad4(seed); }

function parseCode(text) {
  const d = String(text || '').replace(/\D/g, '');
  if (d.length !== 5) return null;
  const levelId = Number(d[0]);
  if (!LEVELS[levelId]) return null;
  return { levelId, seed: Number(d.slice(1)) };
}

function randomSeed() { return Math.floor(Math.random() * 10000); }

function seedForSecret(levelId, secret) {
  const start = randomSeed();
  for (let i = 0; i < 10000; i++) {
    const s = (start + i) % 10000;
    if (secretFor(levelId, s) === secret) return s;
  }
  return null;
}

/* 지금까지의 응답과 모순되지 않는 후보인가 */
function isConsistent(c, plays) {
  for (const p of plays) {
    if (p.win) continue;
    if (p.g === c) return false;
    if (gcd(p.g, c) !== p.r) return false;
  }
  return true;
}

/* 숫자를 한국어로 읽을 때 받침이 있는가 (일·삼·육·칠·팔, 십·백·천·만) */
function hasBatchim(n) {
  const d = n % 10;
  return d === 0 || d === 1 || d === 3 || d === 6 || d === 7 || d === 8;
}
function josa(n, withB, withoutB) { return hasBatchim(n) ? withB : withoutB; }

/* ===== 저장소: 학급 서버(Firebase) 또는 이 노트북(localStorage) ===== */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장할 수 없는 환경 */ } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* 무시 */ } },
};

const LOCAL = {
  profile: key => 'gcdbb.v3.p.' + key,
  save: key => 'gcdbb.v3.save.' + key,
  index: 'gcdbb.v3.index',
  games: 'gcdbb.v3.games',
  live: 'gcdbb.v3.live',
};

/* Firebase 경로에 쓸 수 없는 문자는 _로 바꾼다 */
const keyOf = (sid, name) => (sid + '_' + name).replace(/[.#$\[\]\/\u0000-\u001f\u007f]/g, '_');
const appPath = sub => 'apps/' + APP_ID + '/' + sub;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
}

const Net = (() => {
  let mode = 'pending';                    // pending | firebase | local
  let FB = null, auth = null, db = null;
  let resolveReady;
  const ready = new Promise(r => { resolveReady = r; });
  const statusSubs = new Set();
  let presence = null;
  let presenceToken = 0;

  const notify = () => window.dispatchEvent(new Event('gcdbb:data'));
  window.addEventListener('storage', e => { if (e.key && e.key.indexOf('gcdbb.v3.') === 0) notify(); });

  function loadScript(src, ms) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      const timer = setTimeout(() => reject(new Error('timeout')), ms);
      s.src = src;
      s.async = false;
      s.onload = () => { clearTimeout(timer); resolve(); };
      s.onerror = () => { clearTimeout(timer); reject(new Error('load')); };
      document.head.appendChild(s);
    });
  }

  async function readConfig() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) return FIREBASE_CONFIG;
    if (!/^https?:$/.test(location.protocol)) return null;
    try {
      const res = await withTimeout(fetch('/__/firebase/init.json', { cache: 'no-store' }), 4000);
      if (!res.ok) return null;
      const cfg = await res.json();
      return cfg && cfg.databaseURL ? cfg : null;
    } catch (e) {
      return null;
    }
  }

  async function boot() {
    try {
      const cfg = await readConfig();
      if (!cfg) throw new Error('no-config');
      for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']) {
        await loadScript(FIREBASE_SDK_BASE + f, 12000);
      }
      FB = window.firebase;
      if (!FB || typeof FB.initializeApp !== 'function') throw new Error('no-sdk');
      FB.initializeApp(cfg);
      auth = FB.auth();
      db = FB.database();
      await withTimeout(new Promise(r => { const off = auth.onAuthStateChanged(() => { off(); r(); }); }), 8000).catch(() => {});
      mode = 'firebase';
    } catch (e) {
      mode = 'local';
    }
    resolveReady(mode);
    statusSubs.forEach(f => { try { f(mode); } catch (e) { /* 무시 */ } });
  }

  const TS = () => (FB ? FB.database.ServerValue.TIMESTAMP : Date.now());
  const clean = v => JSON.parse(JSON.stringify(v));

  async function studentAuth() {
    if (mode !== 'firebase') return false;
    if (auth.currentUser) return true;
    try { await withTimeout(auth.signInAnonymously(), 10000); return true; }
    catch (e) { return false; }
  }

  /* 이 노트북에 저장 */
  const local = {
    getProfile: key => store.get(LOCAL.profile(key), null),
    setProfile(p) {
      store.set(LOCAL.profile(p.key), p);
      const idx = store.get(LOCAL.index, []);
      const list = Array.isArray(idx) ? idx : [];
      if (!list.includes(p.key)) { list.push(p.key); store.set(LOCAL.index, list); }
      notify();
    },
    players() {
      const out = {};
      const idx = store.get(LOCAL.index, []);
      (Array.isArray(idx) ? idx : []).forEach(k => { const p = store.get(LOCAL.profile(k), null); if (p) out[k] = p; });
      return out;
    },
    games() { const a = store.get(LOCAL.games, []); return Array.isArray(a) ? a : []; },
    addGame(g) { const a = local.games(); a.push(g); store.set(LOCAL.games, a.slice(-3000)); notify(); },
    live() { const m = store.get(LOCAL.live, {}); return m && typeof m === 'object' && !Array.isArray(m) ? m : {}; },
    setLive(key, data) {
      const m = local.live();
      m[key] = Object.assign({}, m[key], data, { t: Date.now() });
      store.set(LOCAL.live, m);
      notify();
    },
    clearLive() { store.del(LOCAL.live); notify(); },
    clearAll() {
      const idx = store.get(LOCAL.index, []);
      (Array.isArray(idx) ? idx : []).forEach(k => { store.del(LOCAL.profile(k)); store.del(LOCAL.save(k)); });
      store.del(LOCAL.index); store.del(LOCAL.games); store.del(LOCAL.live);
      notify();
    },
  };

  return {
    ready,
    boot,
    get mode() { return mode; },
    onStatus(f) { statusSubs.add(f); return () => statusSubs.delete(f); },

    /* ----- 학생 ----- */
    localProfile: key => local.getProfile(key),
    saveLocalProfile: p => local.setProfile(p),
    /* undefined: 서버를 확인할 수 없음, null: 서버에 기록 없음 */
    async remoteProfile(key) {
      if (mode !== 'firebase' || !(await studentAuth())) return undefined;
      try { const snap = await withTimeout(db.ref(appPath('players/' + key)).once('value'), 8000); return snap.val(); }
      catch (e) { return undefined; }
    },
    saveProfile(p) {
      local.setProfile(p);
      if (mode === 'firebase') studentAuth().then(ok => { if (ok) db.ref(appPath('players/' + p.key)).set(clean(p)).catch(() => {}); });
    },
    addGame(g) {
      if (mode === 'firebase') studentAuth().then(ok => { if (ok) db.ref(appPath('plays')).push(clean(g)).catch(() => {}); });
      else local.addGame(g);
    },
    live(key, data) {
      if (mode === 'firebase') {
        studentAuth().then(ok => { if (ok) db.ref(appPath('live/' + key)).update(Object.assign(clean(data), { online: true, t: TS() })).catch(() => {}); });
      } else {
        local.setLive(key, Object.assign({}, data, { online: true }));
      }
    },
    startPresence(key, data) {
      this.stopPresence(false);
      const token = ++presenceToken;
      if (mode === 'firebase') {
        studentAuth().then(ok => {
          if (!ok || token !== presenceToken) return;
          const conn = db.ref('.info/connected');
          const ref = db.ref(appPath('live/' + key));
          const cb = snap => {
            if (snap.val() !== true) return;
            ref.onDisconnect().update({ online: false, t: TS() }).catch(() => {});
            ref.update(Object.assign(clean(data), { online: true, t: TS() })).catch(() => {});
          };
          conn.on('value', cb);
          presence = { key, conn, cb, ref };
        });
      } else {
        local.setLive(key, Object.assign({}, data, { online: true }));
        presence = { key };
      }
    },
    stopPresence(markOffline) {
      presenceToken += 1;
      if (!presence) return;
      const p = presence;
      presence = null;
      if (mode === 'firebase' && p.conn) {
        p.conn.off('value', p.cb);
        p.ref.onDisconnect().cancel().catch(() => {});
        if (markOffline) p.ref.update({ online: false, state: 'out', t: TS() }).catch(() => {});
      } else if (markOffline) {
        local.setLive(p.key, { online: false, state: 'out' });
      }
    },

    /* ----- 게임 목록에서 선생님이 연 게임 ----- */
    watchHub(cb) {
      if (mode !== 'firebase') { cb(null); return () => {}; }
      const ref = db.ref('hub');
      const h = ref.on('value', s => cb(s.val()), () => cb(null));
      return () => ref.off('value', h);
    },

    /* ----- 선생님 ----- */
    teacher() {
      return mode === 'firebase' && auth && auth.currentUser && !auth.currentUser.isAnonymous ? auth.currentUser : null;
    },
    async teacherSignIn() {
      await auth.setPersistence(FB.auth.Auth.Persistence.SESSION);
      await auth.signInWithPopup(new FB.auth.GoogleAuthProvider());
    },
    async teacherSignOut() {
      if (mode === 'firebase' && this.teacher()) await auth.signOut();
    },
    /* what: 'players' | 'live' | { code } */
    watch(what, cb, onErr) {
      if (mode === 'firebase') {
        const ref = what === 'players' ? db.ref(appPath('players'))
          : what === 'live' ? db.ref(appPath('live'))
          : db.ref(appPath('plays')).orderByChild('code').equalTo(what.code);
        const h = ref.on('value', s => cb(s.val() || {}), err => { if (onErr) onErr(err); });
        return () => ref.off('value', h);
      }
      const fire = () => {
        if (what === 'players') cb(local.players());
        else if (what === 'live') cb(local.live());
        else {
          const out = {};
          local.games().forEach((g, i) => { if (g && g.code === what.code) out['g' + i] = g; });
          cb(out);
        }
      };
      fire();
      window.addEventListener('gcdbb:data', fire);
      return () => window.removeEventListener('gcdbb:data', fire);
    },
    async clearLive() {
      if (mode === 'firebase') await db.ref(appPath('live')).remove();
      else local.clearLive();
    },
    async clearAll() {
      if (mode === 'firebase') await db.ref('apps/' + APP_ID).remove();
      else local.clearAll();
    },
  };
})();

/* ===== 선수 기록 ===== */
function lvFresh() { return { f: 0, w: 0, best: null, sum: 0 }; }
function freshProfile(sid, name) {
  return {
    key: keyOf(sid, name), sid, name,
    finished: 0, wins: 0, giveups: 0, hintsUsed: 0, streak: 0, bestStreak: 0, codeWins: 0, made: 0,
    lv: { 1: lvFresh(), 2: lvFresh(), 3: lvFresh() },
    badges: [], tipsSeen: [], recent: [],
  };
}
/* 저장된 값(이 노트북이나 서버)을 믿을 수 있는 모양으로 정리 */
function normalizeProfile(s, sid, name) {
  const base = freshProfile(sid, name);
  if (!s || typeof s !== 'object') return base;
  const num = v => (Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0);
  for (const k of ['finished', 'wins', 'giveups', 'hintsUsed', 'streak', 'bestStreak', 'codeWins', 'made']) base[k] = num(s[k]);
  for (const k of [1, 2, 3]) {
    const v = s.lv && s.lv[k];
    if (v) base.lv[k] = { f: num(v.f), w: num(v.w), best: Number.isFinite(v.best) ? v.best : null, sum: num(v.sum) };
  }
  base.badges = toArr(s.badges).filter(x => BADGES.some(b => b.id === x));
  base.tipsSeen = toArr(s.tipsSeen).filter(x => typeof x === 'string');
  base.recent = toArr(s.recent).filter(r => r && LEVELS[r.levelId] && typeof r.code === 'string')
    .sort((a, b) => (Number(b.t) || 0) - (Number(a.t) || 0)).slice(0, 20);
  return base;
}
/* 두 기록 중 경기를 더 많이 한 쪽을 바탕으로, 기록(배지)은 합친다 */
function mergeProfiles(a, b) {
  if (!b) return a;
  const base = b.finished >= a.finished ? b : a;
  const other = base === a ? b : a;
  const out = JSON.parse(JSON.stringify(base));
  out.badges = BADGES.map(x => x.id).filter(id => base.badges.includes(id) || other.badges.includes(id));
  out.tipsSeen = [...new Set([...base.tipsSeen, ...other.tipsSeen])];
  out.made = Math.max(base.made, other.made);
  return out;
}

function loadSavedGame() {
  if (!me) return null;
  const s = store.get(KEY.save(me.key), null);
  if (!s || !LEVELS[s.levelId] || !Number.isInteger(s.seed) || s.seed < 0 || s.seed > 9999) return null;
  const secret = secretFor(s.levelId, s.seed);
  const cap = LEVELS[s.levelId].cap;
  const seen = new Set(), plays = [];
  for (const p of (Array.isArray(s.plays) ? s.plays : [])) {
    const g = p && p.g;
    if (!Number.isInteger(g) || g < 1 || g > cap || seen.has(g) || g === secret) continue;
    seen.add(g);
    plays.push({ g, r: gcd(g, secret), win: false });
  }
  const valid = new Set(candidates(s.levelId));
  const nums = a => (Array.isArray(a) ? a.filter(n => valid.has(n)) : []);
  return {
    levelId: s.levelId, seed: s.seed, secret, plays, via: s.via === 'code' ? 'code' : 'practice',
    hints: Math.max(0, Number(s.hints) || 0), marks: nums(s.marks), auto: nums(s.auto), revived: [], note: '',
  };
}

}

  if (Net.mode === 'firebase') {

    if (!me) return;
    if (remote === undefined) {
      syncNote = '학급 서버에 닿지 않아 이 노트북에 먼저 저장하고 있어요.';
      updateFoot();
    } else {

      const changed = JSON.stringify(merged) !== JSON.stringify(me);
      me = merged;
      Net.saveProfile(me);
      if (changed && (view === 'home' || view === 'records')) render();
    }
  }
  if (view !== 'teacher') Net.startPresence(me.key, liveData());

function lineScore(plays, idPrefix) {
  const cols = Math.max(9, plays.length);
  let head = '<th scope="col">타석</th>', gRow = '<th scope="row">부른 수</th>', rRow = '<th scope="row">응답</th>';
  for (let i = 0; i < cols; i++) {
    const p = plays[i];
    const now = p && i === plays.length - 1;
    const gid = idPrefix ? ` id="${idPrefix}g${i}"` : '';
    const rid = idPrefix ? ` id="${idPrefix}r${i}"` : '';
    head += `<th scope="col">${i + 1}</th>`;
    if (p) {
      gRow += `<td class="${now ? 'now' : ''}"${gid}>${p.g}</td>`;
      rRow += `<td class="${[p.win ? 'hr' : '', now ? 'now' : ''].join(' ').trim()}"${rid}>${p.win ? 'HR' : p.r}</td>`;
    } else {
      gRow += `<td class="empty"${gid}>·</td>`;
      rRow += `<td class="empty"${rid}>·</td>`;
    }
  }
  return `<table class="ls"><thead><tr>${head}</tr></thead><tbody><tr>${gRow}</tr><tr>${rRow}</tr></tbody></table>`;
}

let loggingIn = false;
async function doLogin() {
  if (loggingIn) return;
  const sidEl = $('#sidIn'), nameEl = $('#nameIn'), err = $('#loginErr'), btn = document.querySelector('[data-act="login"]');
  if (!sidEl || !nameEl) return;
  const sid = sidEl.value.replace(/\s+/g, '');
  const name = normName(nameEl.value);
  if (!validSid(sid)) { err.textContent = '학번은 숫자 4~6자리로 입력하세요. 예: 10523'; sidEl.focus(); sidEl.select(); return; }
  if (!name) { err.textContent = '이름을 입력하세요.'; nameEl.focus(); return; }
  if (!validName(name)) { err.textContent = '이름은 20자까지 입력할 수 있어요.'; nameEl.focus(); return; }
  loggingIn = true;
  err.textContent = '';
  if (btn) { btn.disabled = true; btn.textContent = '기록을 불러오는 중…'; }
  const key = keyOf(sid, name);
  let prof = normalizeProfile(Net.localProfile(key), sid, name);
  await Promise.race([Net.ready, sleep(7000)]);
  syncNote = '';
  if (Net.mode === 'firebase') {
    const remote = await Net.remoteProfile(key);
    if (remote === undefined) syncNote = '학급 서버에 닿지 않아 이 노트북에 먼저 저장하고 있어요.';
    else prof = mergeProfiles(prof, remote ? normalizeProfile(remote, sid, name) : null);
  }
  loggingIn = false;
  me = prof;
  Net.saveProfile(me);
  store.set(KEY.current, { sid, name });
  game = null;
  lastResult = null;
  homeLevel = defaultLevel();
  Net.startPresence(me.key, liveData());
  go('home');
}
function doLogout() {
  Net.stopPresence(true);
  syncNote = '';
  me = null;
  game = null;
  lastResult = null;
  store.del(KEY.current);
  homeLevel = 1;
  go('home');
  const s = $('#sidIn');
  if (s && !coarse()) s.focus();
}

/* ===== 경기 ===== */
function startGame(levelId, seed, via) {
  if (!me) { go('home'); return; }
  game = { levelId, seed, via, secret: secretFor(levelId, seed), plays: [], hints: 0, marks: [], auto: [], revived: [], note: '' };
  saveGame();
  go('game');
}

function memoGridHTML() {
  const called = new Set(game.plays.map(p => p.g));
  const auto = new Set(game.auto), marks = new Set(game.marks), revived = new Set(game.revived);
  return candidates(game.levelId).map(n => {
    let cls = 'num', extra = '', label = String(n), pressed = false;
    if (called.has(n)) { cls += ' called'; extra = ' disabled'; label += ', 이미 부른 수'; }
    else if (auto.has(n)) { cls += ' auto'; extra = ' disabled'; label += ', 전력분석으로 지운 수'; }
    else if (marks.has(n)) { cls += ' x'; label += ', 지운 수'; pressed = true; }
    if (revived.has(n)) cls += ' revived';
    return `<button type="button" class="${cls}" data-n="${n}" aria-pressed="${pressed}" aria-label="${label}"${extra}>${n}</button>`;
  }).join('');
}
function remainingCount() {
  const gone = new Set([...game.marks, ...game.auto, ...game.plays.map(p => p.g)]);
  return candidates(game.levelId).filter(n => !gone.has(n)).length;
}

function revealLatest(wrap) {
  if (!wrap) return;
  const cell = wrap.querySelector('td.now');
  if (!cell) { wrap.scrollLeft = 0; return; }
  wrap.scrollLeft = Math.max(0, cell.offsetLeft + cell.offsetWidth - wrap.clientWidth + 8);
}

function afterGame(justGuessed) {
  revealLatest($('#lsWrap'));
  const inp = $('#guessIn');
  if (inp && (justGuessed || !coarse())) inp.focus({ preventScroll: true });
  if (justGuessed) rollLED($('#roResp'));
  game.revived = [];
}

function rollLED(el) {
  if (!el) return;
  const final = el.textContent;
  if (reduceMotion()) return;
  let i = 0;
  const tick = () => {
    i += 1;
    if (i > 8) {
      el.textContent = final;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      return;
    }
    el.textContent = Array.from({ length: final.length }, () => Math.floor(Math.random() * 10)).join('');
    later(tick, 45);
  };
  tick();
}

function submitGuess() {
  const inp = $('#guessIn'), err = $('#guessErr');
  if (!inp || !game) return;
  const raw = inp.value.trim().replace(/[,\s]/g, '');
  const L = LEVELS[game.levelId];
  const fail = msg => { err.textContent = msg; inp.focus(); inp.select(); };
  if (!raw) return fail('부를 수를 입력하세요.');
  if (!/^\d+$/.test(raw)) return fail('숫자만 입력할 수 있어요.');
  const g = parseInt(raw, 10);
  if (g < 1 || g > L.cap) return fail(`1부터 ${fmt(L.cap)}까지의 수만 부를 수 있어요.`);
  if (game.plays.some(p => p.g === g)) return fail(`${g}${josa(g, '은', '는')} 이미 불렀어요. 다른 수를 불러 보세요.`);
  const win = g === game.secret;
  game.plays.push({ g, r: gcd(g, game.secret), win });
  game.note = '';
  if (win) { finishGame(true); return; }
  saveGame();
  pendingRoll = true;
  render();
}

function analyze() {
  if (!game || !game.plays.length) return;
  const all = candidates(game.levelId);
  const possible = all.filter(c => isConsistent(c, game.plays));
  const keep = new Set(possible);
  const revived = game.marks.filter(n => keep.has(n));
  game.auto = all.filter(n => !keep.has(n));
  game.marks = [];
  game.revived = revived;
  game.hints += 1;
  game.note = `남은 후보는 ${possible.length}개예요.`
    + (revived.length ? ` 잘못 지운 후보 ${revived.length}개를 되살렸어요.` : '')
    + (possible.length === 1 ? ' 이제 부르기만 하면 돼요.' : '');
  saveGame();
  render();
}

function toggleMark(n) {
  if (!game || view !== 'game') return;
  if (game.auto.includes(n) || game.plays.some(p => p.g === n)) return;
  const i = game.marks.indexOf(n);
  if (i >= 0) game.marks.splice(i, 1); else game.marks.push(n);
  saveGame();
  const on = game.marks.includes(n);
  const btn = document.querySelector(`#numgrid [data-n="${n}"]`);
  if (btn) {
    btn.classList.toggle('x', on);
    btn.classList.remove('revived');
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? `${n}, 지운 수` : String(n));
  }
  const cnt = $('#memoCount');
  if (cnt) cnt.textContent = `${remainingCount()}개 남음`;
  const clr = $('#clearMarks');
  if (clr) clr.disabled = !game.marks.length;
}

function clearMarks() {
  if (!game) return;
  game.marks = [];
  saveGame();
  const grid = $('#numgrid');
  if (grid) grid.innerHTML = memoGridHTML();
  const cnt = $('#memoCount');
  if (cnt) cnt.textContent = `${remainingCount()}개 남음`;
  const clr = $('#clearMarks');
  if (clr) clr.disabled = true;
}

function onGiveup(btn) {
  if (!giveupArmed) {
    giveupArmed = true;
    btn.textContent = '한 번 더 누르면 기권해요';
    btn.classList.add('armed');
    later(() => {
      giveupArmed = false;
      if (btn.isConnected) { btn.textContent = '기권하기'; btn.classList.remove('armed'); }
    }, 3000);
    return;
  }
  giveupArmed = false;
  finishGame(false);
}

function pickTip() {
  const open = TIPS.filter(t => t.need(me));
  if (!open.length) return '';
  const fresh = open.find(t => !me.tipsSeen.includes(t.id));
  if (fresh) { me.tipsSeen.push(fresh.id); return fresh.text; }
  return open[Math.floor(Math.random() * open.length)].text;
}

const isPrimePower = n => { const f = factorize(n); return f.length === 1 && f[0][1] >= 2; };

function awardBadges(g, won, attempts) {
  const newly = [];
  const award = id => { if (!me.badges.includes(id)) { me.badges.push(id); newly.push(id); } };
  award('debut');
  if (me.finished >= 10) award('g10');
  if (won) {
    award('first');
    if (me.wins >= 5) award('w5');
    if (me.wins >= 10) award('w10');
    if (me.streak >= 3) award('streak3');
    if (g.hints === 0) award('solo');
    if (attempts >= 8) award('grit');
    if (g.via === 'code') award('rival');
    if (g.levelId === 1 && attempts <= 4) award('l1');
    if (g.levelId === 2 && attempts <= 5) award('l2');
    if (g.levelId === 2 && attempts <= 3) award('l2ace');
    if (g.levelId === 3) award('l3');
    if (g.levelId === 3 && attempts <= 4) award('l3ace');
    if ([1, 2, 3].every(k => me.lv[k].w > 0)) award('allround');
    const before = g.plays.slice(0, -1);
    if (g.hints === 0 && before.length && candidates(g.levelId).filter(c => isConsistent(c, before)).length === 1) award('deduce');
    if (g.plays.length === 1) award('firstpitch');
    if (g.plays.filter(p => isPrimePower(p.g)).length >= 3) award('power');
  }
  return newly;
}

function finishGame(won) {
  const g = game, attempts = g.plays.length + g.hints, lv = me.lv[g.levelId];
  me.finished += 1;
  lv.f += 1;
  me.hintsUsed += g.hints;
  if (won) {
    me.wins += 1;
    lv.w += 1;
    lv.sum += attempts;
    if (lv.best == null || attempts < lv.best) lv.best = attempts;
    me.streak += 1;
    me.bestStreak = Math.max(me.bestStreak, me.streak);
    if (g.via === 'code') me.codeWins += 1;
  } else {
    me.giveups += 1;
    me.streak = 0;
  }
  me.recent.unshift({ t: Date.now(), levelId: g.levelId, code: formatCode(g.levelId, g.seed), won, attempts, hints: g.hints, via: g.via });
  me.recent = me.recent.slice(0, 20);
  const newly = awardBadges(g, won, attempts);
  const tip = pickTip();
  saveProfile();
  clearSave();
  Net.addGame({
    key: me.key, sid: me.sid, name: me.name, levelId: g.levelId, code: formatCode(g.levelId, g.seed),
    won, attempts, hints: g.hints, via: g.via, t: Date.now(),
  });
  lastResult = { levelId: g.levelId, seed: g.seed, secret: g.secret, plays: g.plays.slice(), hints: g.hints, attempts, won, newly, tip };
  game = null;
  go('result');
}

/* ===== 결과 ===== */
function isPrime(n) { const f = factorize(n); return f.length === 1 && f[0][1] === 1; }
function primeHTML(n, hits) {
  return factorize(n).map(([p, e]) => {
    const t = e > 1 ? `${p}<sup>${e}</sup>` : String(p);
    return hits && hits.has(p) ? `<mark>${t}</mark>` : t;
  }).join(' × ');
}
function numWithFactors(n, hits) {
  if (n === 1) return '1';
  if (isPrime(n)) return hits && hits.has(n) ? `<mark>${n}</mark>` : String(n);
  return `${n} = ${primeHTML(n, hits)}`;
}

function resultActions(R) {
  const again = (lv, label, primary) =>
    `<button type="button" class="btn${primary ? ' primary' : ''}" data-act="again" data-level="${lv}">${label}</button>`;
  const L = LEVELS[R.levelId];
  let html;
  if (R.levelId === 1 && me.lv[1].w >= 2) html = again(2, '기본 난이도로 올라가기', true) + again(1, '입문 한 판 더', false);
  else if (R.levelId === 2 && me.lv[2].w >= 3) html = again(2, '기본 난이도로 새 경기', true) + again(3, '도전으로 올라가기', false);
  else html = again(R.levelId, `${L.name} 난이도로 새 경기`, true);
  return `<div class="actions">${html}<button type="button" class="btn" data-act="records">기록실</button><button type="button" class="btn" data-act="home">처음으로</button></div>`;
}

function resultHTML() {
  const R = lastResult, L = LEVELS[R.levelId], code = formatCode(R.levelId, R.seed);

  const rows = R.plays.map((p, i) => p.win
    ? `<li class="win"><span class="play-n">${i + 1}</span><span class="play-body"><span class="fx">${p.g}</span><span class="res">홈런</span></span></li>`
    : `<li><span class="play-n">${i + 1}</span><span class="play-body"><span class="fx">${numWithFactors(p.g, hits)}</span><span class="res">응답 ${numWithFactors(p.r, null)}${p.r === 1 ? ' (서로소)' : ''}</span></span></li>`
  ).join('');
  const line = R.won
    ? `${R.attempts}타석 만에 비밀 수 ${R.secret}${josa(R.secret, '을', '를')} 찾았어요.`
    : `비밀 수는 ${R.secret}${josa(R.secret, '이었어요', '였어요')}.`;
  const challenge = R.won
    ? `옆 친구에게 경기 코드 ${code}${josa(R.seed, '을', '를')} 알려 주세요. 같은 비밀 수로 누가 더 적은 타석에 홈런을 치는지 겨룰 수 있어요.`
    : '새 경기에서 다시 도전해 보세요.';
  const newly = BADGES.filter(b => R.newly.includes(b.id)).map(b => b.id);
  return `
<section class="board result-board${R.won ? ' won' : ''}">
  ${R.won ? ballSVG('fly-ball') : ''}
  <h1 class="result-title">${R.won ? '홈런!' : '기권'}</h1>
  <p class="result-line">${line}</p>
  <div class="plates">
    <div class="plate"><span class="lbl">난이도</span><span class="val">${L.name}</span></div>
    <div class="plate"><span class="lbl">경기 코드</span><span class="led val">${code}</span></div>
    <div class="plate"><span class="lbl">타석</span><span class="led val">${R.attempts}</span></div>
  </div>
  <div class="ls-wrap">${lineScore(R.plays)}</div>
  <p class="board-sub">${challenge}</p>
</section>
<div class="result-grid">
  <section class="panel">
    <h2>경기 분석</h2>
    <p class="secret-line">비밀 수 <b>${numWithFactors(R.secret, null)}</b></p>
    ${R.plays.length ? `<ol class="plays">${rows}</ol>` : '<p class="muted">부른 수가 없어요.</p>'}
    ${R.hints ? `<p class="muted small">전력분석팀을 ${R.hints}번 불러서 타석에 ${R.hints}${josa(R.hints, '이', '가')} 더해졌어요.</p>` : ''}

/* ===== 기록실 ===== */
function when(t) {
  const d = new Date(t);
  if (Number.isNaN(d.getTime())) return '';
  const now = new Date();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return d.toDateString() === now.toDateString() ? `오늘 ${hh}:${mm}` : `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

/* ===== 문제 내기 ===== */

<div class="create-grid">

    <div class="actions">

function makeCode() {
  if (!create.selected || !me) return;
  const seed = seedForSecret(create.levelId, create.selected);
  if (seed == null) { create.note = '코드를 만들지 못했어요. 한 번 더 눌러 보세요.'; render(); return; }
  create.seed = seed;
  create.peek = false;
  me.made += 1;
  if (!me.badges.includes('maker')) {
    me.badges.push('maker');
    create.note = '기록실에 ‘출제 위원’이 생겼어요.';
  } else {
    create.note = '';
  }
  saveProfile();
  render();
}

/* ===== 이동과 입력 ===== */
function join() {
  const inp = $('#codeIn'), err = $('#joinErr');
  if (!inp) return;
  const digits = inp.value.replace(/\D/g, '');
  if (!digits) { err.textContent = '경기 코드를 입력하세요. 예: 2-4821'; inp.focus(); return; }
  const p = parseCode(inp.value);
  if (!p) {
    err.textContent = digits.length !== 5 ? '경기 코드는 숫자 다섯 자리예요. 예: 2-4821' : '경기 코드는 1, 2, 3 중 하나로 시작해요.';
    inp.focus();
    inp.select();
    return;
  }
  startGame(p.levelId, p.seed, 'code');
}

function onLevel(btn) {
  const id = Number(btn.dataset.level);
  if (btn.dataset.scope === 'home') {
    homeLevel = id;
    const panel = $('#practice');
    if (panel) {
      panel.innerHTML = practiceInner();
      const nb = panel.querySelector(`[data-level="${id}"]`);
      if (nb) nb.focus();
    }
  } else {
    create = { levelId: id, selected: null, seed: null, peek: false, note: '' };
    render();
    const nb = document.querySelector(`[data-scope="create"][data-level="${id}"]`);
    if (nb) nb.focus();
  }
}

function applyBig() {
  document.documentElement.classList.toggle('big', big);
  const b = $('#bigBtn');
  b.setAttribute('aria-pressed', String(big));
  b.textContent = big ? '원래 크기로' : '화면 크게';
}

/* ===== 아래쪽 정보 줄과 수업 현황 ===== */
function updateFoot() {
  const f = $('#foot');
  if (!f) return;
  if (view === 'teacher') {
    const [cls, text] = Net.mode === 'firebase' ? ['on', '기록 저장: 학급 서버']
      : Net.mode === 'local' ? ['local', '기록 저장: 이 노트북'] : ['', '학급 서버 확인 중'];
    f.innerHTML = `<span class="sync ${cls}">${text}</span>${syncNote ? `<span class="sync-note">${esc(syncNote)}</span>` : ''}`
      + '<button type="button" class="text-btn" data-act="home">학생 화면으로</button>';
    return;
  }
  f.innerHTML = window.CLASS_GAMES_HUB ? '<a class="text-btn hub-link" href="../">게임 목록</a>' : '';
}
function liveData() {
  const d = { sid: me.sid, name: me.name, state: view === 'teacher' ? 'home' : view, levelId: null, code: null, attempts: null, won: null };
  if (view === 'game' && game) Object.assign(d, { levelId: game.levelId, code: formatCode(game.levelId, game.seed), attempts: game.plays.length + game.hints });
  else if (view === 'result' && lastResult) Object.assign(d, { levelId: lastResult.levelId, code: formatCode(lastResult.levelId, lastResult.seed), attempts: lastResult.attempts, won: lastResult.won });
  return d;
}
function pushLive() { if (me && view !== 'teacher') Net.live(me.key, liveData()); }

function render() {
  clearTimers();
  giveupArmed = false;
  if (!me && view !== 'home' && view !== 'teacher') view = 'home';
  if (view === 'game' && !game) view = 'home';
  if (view === 'result' && !lastResult) view = 'home';
  const closed = closedByTeacher() && (view === 'home' || view === 'create' || view === 'records');
  const html = closed ? closedHTML()
    : view === 'home' ? homeHTML()
    : view === 'game' ? gameHTML()
    : view === 'result' ? resultHTML()
    : view === 'records' ? recordsHTML()
    : view === 'teacher' ? teacherHTML()
    : createHTML();
  $('#view').innerHTML = html;
  const homeBtn = $('#homeBtn');
  homeBtn.hidden = view === 'home';
  homeBtn.textContent = view === 'teacher' ? '학생 화면으로' : '처음으로';
  const chip = $('#meChip');
  chip.hidden = !me || view === 'home' || view === 'teacher';
  chip.innerHTML = me ? `<span class="no">${esc(me.sid)}</span>${esc(me.name)}` : '';
  updateFoot();
  pushLive();
  if (closed) return;
  if (view === 'home') runDemo();
  else if (view === 'game') { const roll = pendingRoll; pendingRoll = false; afterGame(roll); }
  else if (view === 'result') {
    revealLatest(document.querySelector('.result-board .ls-wrap'));
    const b = document.querySelector('[data-act="again"]');
    if (b && !coarse()) b.focus({ preventScroll: true });
  }
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    create.selected = Number(pick.dataset.pick);
    create.seed = null; create.peek = false; create.note = '';
    render();
    return;
  }
  const num = e.target.closest('[data-n]');
  if (num) { toggleMark(Number(num.dataset.n)); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  switch (a.dataset.act) {
    case 'home': if (view === 'teacher') leaveTeacher(); else go('home'); break;
    case 'teacher': openTeacher(); break;
    case 'toggleBig': big = !big; store.set(KEY.big, big); applyBig(); break;
    case 'login': doLogin(); break;
    case 'logout': doLogout(); break;
    case 'records': if (me) go('records'); break;
    case 'level': onLevel(a); break;
    case 'practice': startGame(homeLevel, randomSeed(), 'practice'); break;
    case 'join': join(); break;
    case 'create': create = { levelId: homeLevel, selected: null, seed: null, peek: false, note: '' }; go('create'); break;
    case 'resume': { const s = loadSavedGame(); if (s) { game = s; go('game'); } else render(); break; }
    case 'nextDemo': demoIndex = (demoIndex + 1) % DEMOS.length; clearTimers(); runDemo(); break;
    case 'guess': submitGuess(); break;
    case 'analyze': analyze(); break;
    case 'clearMarks': clearMarks(); break;
    case 'giveup': onGiveup(a); break;
    case 'again': {
      const lv = Number(a.dataset.level) || (lastResult && lastResult.levelId) || 1;
      homeLevel = lv;
      startGame(lv, randomSeed(), 'practice');
      break;
    }
    case 'pickRandom': {
      const c = candidates(create.levelId);
      create.selected = c[Math.floor(Math.random() * c.length)];
      create.seed = null; create.peek = false; create.note = '';
      render();
      break;
    }
    case 'makeCode': makeCode(); break;
    case 'reroll': makeCode(); break;
    case 'peek': create.peek = !create.peek; render(); break;
    default: onTeacherAct(a);
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const id = e.target.id;
  if (id === 'guessIn') { e.preventDefault(); submitGuess(); }
  else if (id === 'codeIn') { e.preventDefault(); join(); }
  else if (id === 'sidIn') {
    e.preventDefault();
    const n = $('#nameIn');
    if (n && !n.value.trim()) n.focus(); else doLogin();
  }
  else if (id === 'nameIn') { e.preventDefault(); doLogin(); }
  else if (id === 'tcodeIn') { e.preventDefault(); showCode(e.target.value); }
});

/* ===== 선생님 화면 ===== */
const T = {
  tab: 'live', cls: 'all', sort: { col: 'sid', dir: 1 }, open: null,
  code: '', genLevel: 2, reveal: {}, players: {}, live: {}, games: {},
  err: '', note: '', busy: false, armed: null, armTimer: null,
  unsub: [], codeUnsub: null, tick: null,
};
const TTABS = [['live', '수업 현황'], ['code', '경기 코드'], ['students', '학생 기록'], ['manage', '관리']];

const groupOf = sid => (typeof sid === 'string' && sid.length >= 4 ? sid.slice(0, sid.length - 2) : '');
const groupLabel = g => (g.length >= 2 ? `${g[0]}학년 ${Number(g.slice(1))}반` : g);
const inCls = sid => T.cls === 'all' || groupOf(sid) === T.cls;
function groupsFrom(sids) {
  const set = new Set();
  sids.forEach(sid => { const g = groupOf(sid); if (g) set.add(g); });
  return [...set].sort();
}
function clock(t) {
  const d = new Date(Number(t));
  if (Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function rel(t) {
  const n = Number(t);
  if (!n) return '';
  const s = Math.max(0, Math.round((Date.now() - n) / 1000));
  if (s < 60) return '방금';
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  return clock(n);
}

function teacherCodes() {
  const a = store.get(KEY.tcodes, []);
  return (Array.isArray(a) ? a : []).filter(x => x && typeof x.code === 'string' && parseCode(x.code));
}
function addTeacherCode(levelId) {
  const code = formatCode(levelId, randomSeed());
  const list = teacherCodes().filter(x => x.code !== code);
  list.unshift({ code, t: Date.now() });
  store.set(KEY.tcodes, list.slice(0, 20));
  return code;
}

/* ----- 들어가고 나오기, 자료 받기 ----- */
function openTeacher() {
  view = 'teacher';
  try { history.replaceState(null, '', '#teacher'); } catch (e) { /* 무시 */ }
  render();
  window.scrollTo(0, 0);
  startTeacherData();
}
function leaveTeacher() {
  stopTeacherData();
  Net.teacherSignOut().catch(() => {});
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
  T.err = '';
  T.note = '';
  go('home');
  if (me) Net.startPresence(me.key, liveData());
}
function startTeacherData() {
  stopTeacherData();
  if (view !== 'teacher') return;
  if (Net.mode === 'pending') {
    Net.ready.then(() => { if (view === 'teacher') { render(); startTeacherData(); } });
    return;
  }
  if (Net.mode === 'firebase' && !Net.teacher()) return;
  const denied = () => {
    T.err = '이 계정으로는 기록을 볼 수 없어요. 규칙 파일에 적은 선생님 Google 계정으로 로그인했는지 확인하세요.';
    renderTeacherBody();
  };
  T.unsub.push(Net.watch('players', v => { T.players = v || {}; onTeacherData('players'); }, denied));
  T.unsub.push(Net.watch('live', v => { T.live = v || {}; onTeacherData('live'); }, denied));
  if (T.code) watchCode(T.code);
  T.tick = setInterval(() => { if (view === 'teacher' && T.tab === 'live') renderTeacherBody(); }, 20000);
}
function stopTeacherData() {
  T.unsub.forEach(f => { try { f(); } catch (e) { /* 무시 */ } });
  T.unsub = [];
  if (T.codeUnsub) { try { T.codeUnsub(); } catch (e) { /* 무시 */ } T.codeUnsub = null; }
  if (T.tick) { clearInterval(T.tick); T.tick = null; }
}
function watchCode(code) {
  if (T.codeUnsub) { try { T.codeUnsub(); } catch (e) { /* 무시 */ } T.codeUnsub = null; }
  T.games = {};
  if (Net.mode === 'pending' || (Net.mode === 'firebase' && !Net.teacher())) return;
  T.codeUnsub = Net.watch({ code }, v => { T.games = v || {}; onTeacherData('games'); }, () => {
    T.err = '경기 기록을 불러오지 못했어요. 선생님 계정과 규칙 파일을 확인하세요.';
    renderTeacherBody();
  });
}
function onTeacherData(kind) {
  if (view !== 'teacher') return;
  if (kind === 'games') { if (T.tab === 'code') renderCodeResults(); return; }
  if (kind === 'live' && T.tab !== 'live') return;
  if (kind === 'players' && T.tab === 'code') return;
  renderTeacherBody();
}
function renderTeacherBody() { const b = $('#tbody'); if (b) b.innerHTML = teacherBodyHTML(); }
function renderCodeResults() { const b = $('#codeResults'); if (b) b.innerHTML = codeResultsHTML(); }

async function teacherSignIn() {
  T.busy = true;
  T.err = '';
  render();
  try {
    await Net.teacherSignIn();
  } catch (e) {
    const c = e && e.code;
    T.err = c === 'auth/popup-blocked' ? '팝업이 막혔어요. 주소창에서 팝업을 허용한 뒤 다시 눌러 주세요.'
      : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? '로그인 창이 닫혔어요. 다시 눌러 주세요.'
      : c === 'auth/unauthorized-domain' ? '이 주소에서는 로그인할 수 없어요. Authentication 설정의 승인된 도메인에 이 주소를 추가하세요.'
      : c === 'auth/operation-not-allowed' ? 'Google 로그인이 꺼져 있어요. Authentication에서 Google 로그인을 사용 설정하세요.'
      : '로그인하지 못했어요. 다시 시도해 주세요.';
  }
  T.busy = false;
  render();
  startTeacherData();
}

function teacherBodyHTML() {
  const err = T.err ? `<p class="err t-err">${esc(T.err)}</p>` : '';

  if (T.tab === 'code') return err + codeTabHTML();

  return err + manageTabHTML();
}

function classFilter(groups) {
  return `<label class="filter"><span>반</span><select id="tcls">
  <option value="all"${T.cls === 'all' ? ' selected' : ''}>전체</option>
  ${groups.map(g => `<option value="${esc(g)}"${T.cls === g ? ' selected' : ''}>${esc(groupLabel(g))}</option>`).join('')}

function liveState(r) {
  const lv = LEVELS[r.levelId];
  const code = r.code ? ` <span class="muted-inline">${esc(r.code)}</span>` : '';
  if (r.state === 'game' && lv) return `<span class="lvl-chip lv${r.levelId}">${lv.name}</span> 경기 중, ${Number(r.attempts) || 0}타석${code}`;
  if (r.state === 'result' && lv) return `<span class="lvl-chip lv${r.levelId}">${lv.name}</span> ${r.won ? `<span class="ok">${Number(r.attempts)}타석 홈런</span>` : '기권'}${code}`;
  return { create: '문제 만드는 중', records: '기록실 보는 중', out: '나감' }[r.state] || '처음 화면';
}

function liveTabHTML() {
  const now = Date.now();
  const rows = Object.entries(T.live).map(([key, v]) => Object.assign({ key }, v)).filter(r => typeof r.sid === 'string');
  const groups = groupsFrom([...rows.map(r => r.sid), ...Object.values(T.players).map(p => p && p.sid)]);
  const shown = rows.filter(r => inCls(r.sid)).sort((a, b) => a.sid.localeCompare(b.sid) || String(a.name).localeCompare(String(b.name)));
  const isOn = r => r.online === true && now - (Number(r.t) || 0) < 15 * 60 * 1000;
  const on = shown.filter(isOn);
  const playing = on.filter(r => r.state === 'game').length;
  const today = new Date().toDateString();

  Object.values(T.players).forEach(p => {

<section class="board t-board">

function codeResultsHTML() {
  if (!T.code) return '';
  const p = parseCode(T.code);
  if (!p) return '';
  const all = Object.values(T.games).filter(g => g && g.code === T.code && typeof g.sid === 'string');
  const first = new Map();
  all.slice().sort((a, b) => (Number(a.t) || 0) - (Number(b.t) || 0)).forEach(g => {
    const k = g.key || keyOf(g.sid, g.name || '');
    if (!first.has(k)) first.set(k, g);
  });
  const groups = groupsFrom([...first.values()].map(g => g.sid));
  const rows = [...first.values()].filter(g => inCls(g.sid));
  const wins = rows.filter(g => g.won);
  const avg = wins.length ? (wins.reduce((s, g) => s + (Number(g.attempts) || 0), 0) / wins.length).toFixed(1) : '-';
  const buckets = Array(10).fill(0);
  wins.forEach(g => { const a = Math.max(1, Number(g.attempts) || 1); buckets[Math.min(a, 10) - 1] += 1; });
  const top = Math.max(1, ...buckets);
  const hist = buckets.map((n, i) => `<div class="hbar"><span class="hcnt led">${n || ''}</span><span class="track"><span class="bar" style="height:${n ? Math.max(4, Math.round(n / top * 100)) : 0}%"></span></span><span class="htick">${i === 9 ? '10+' : i + 1}</span></div>`).join('');
  const ranked = rows.slice().sort((a, b) => (Number(b.won) - Number(a.won)) || ((Number(a.attempts) || 0) - (Number(b.attempts) || 0)) || ((Number(a.t) || 0) - (Number(b.t) || 0)));
  let place = 0;
  const list = ranked.length
    ? `<ol class="rank">${ranked.map(g => `<li><span class="rk">${g.won ? ++place : '-'}</span><span class="lv-sid">${esc(g.sid)}</span><span class="lv-name">${esc(g.name || '')}</span><span class="${g.won ? 'ok' : 'muted-inline'}">${g.won ? `${Number(g.attempts)}타석 홈런` : '기권'}</span><span class="lv-time">${clock(g.t)}</span></li>`).join('')}</ol>`
    : '<p class="muted">아직 이 코드로 끝낸 경기가 없어요.</p>';
  const shown = !!T.reveal[T.code];
  return `<section class="board t-board">
  <div class="rec-head"><span class="lvl-chip lv${p.levelId}">${LEVELS[p.levelId].name}</span><h2 class="code-title led">${T.code}</h2>
    <button type="button" class="board-link" data-act="treveal" data-code="${T.code}" aria-pressed="${shown}">${shown ? `정답 ${secretFor(p.levelId, p.seed)}` : '정답 보기'}</button></div>
  <div class="plates four">
    <div class="plate"><span class="lbl">참가</span><span class="led val">${rows.length}</span></div>
    <div class="plate"><span class="lbl">홈런</span><span class="led val">${wins.length}</span></div>
    <div class="plate"><span class="lbl">기권</span><span class="led val">${rows.length - wins.length}</span></div>
    <div class="plate"><span class="lbl">평균 타석</span><span class="led val">${avg}</span></div>
  </div>
  <p class="hist-cap">몇 타석 만에 홈런을 쳤는지</p>
  <div class="hist" role="img" aria-label="타석 수별 홈런 인원">${hist}</div>
</section>
<section class="panel t-section">
  <div class="filters"><h2>학생별 결과</h2><span class="spacer"></span>${classFilter(groups)}</div>
  <p class="muted small">같은 코드로 여러 번 한 학생은 첫 경기만 셉니다.</p>
  ${list}
</section>`;
}

const SCOLS = [
  ['sid', '학번', 'l'], ['name', '이름', 'l'], ['finished', '경기'], ['wins', '홈런'],
  ['b1', '입문 최소'], ['b2', '기본 최소'], ['b3', '도전 최소'], ['avg2', '기본 평균'], ['badges', '모은 기록'], ['last', '마지막 경기'],
];
function studentRows() {
  return Object.values(T.players).filter(p => p && typeof p.sid === 'string').map(p => {
    const lv = k => (p.lv && p.lv[k]) || {};
    const best = k => (Number.isFinite(Number(lv(k).best)) && lv(k).best != null ? Number(lv(k).best) : null);
    const w2 = Number(lv(2).w) || 0;
    const last = toArr(p.recent).reduce((m, g) => Math.max(m, Number(g && g.t) || 0), 0);
    return {
      key: p.key || keyOf(p.sid, String(p.name || '')), sid: p.sid, name: String(p.name || ''),
      finished: Number(p.finished) || 0, wins: Number(p.wins) || 0, giveups: Number(p.giveups) || 0,
      b1: best(1), b2: best(2), b3: best(3), avg2: w2 ? (Number(lv(2).sum) || 0) / w2 : null,
      badges: toArr(p.badges).length, last: last || null, raw: p,
    };
  });
}
function sortedStudents() {
  const rows = studentRows().filter(r => inCls(r.sid));
  const { col, dir } = T.sort;
  return rows.sort((a, b) => {
    const va = a[col], vb = b[col];
    if (va == null && vb == null) return a.sid.localeCompare(b.sid);
    if (va == null) return 1;
    if (vb == null) return -1;
    const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return c * dir || a.sid.localeCompare(b.sid);
  });
}
function studentDetail(p) {
  const earned = BADGES.filter(b => toArr(p.badges).includes(b.id)).map(b => b.name);
  const rec = toArr(p.recent).slice(0, 8);
  return `<div class="detail-grid">
  <div><h3>모은 기록</h3><p>${earned.length ? earned.map(esc).join(', ') : '아직 없어요'}</p></div>
  <div><h3>최근 경기</h3>${rec.length ? `<ul class="mini-recent">${rec.map(g => `<li><span class="lvl-chip lv${g.levelId}">${(LEVELS[g.levelId] || {}).name || ''}</span>${esc(g.code || '')} ${g.won ? `<span class="ok">${Number(g.attempts)}타석 홈런</span>` : '기권'} <span class="muted-inline">${when(g.t)}</span></li>`).join('')}</ul>` : '<p>아직 없어요</p>'}</div>
</div>`;
}
function studentsTabHTML() {
  const all = studentRows();
  const groups = groupsFrom(all.map(r => r.sid));
  const rows = sortedStudents();
  const { col, dir } = T.sort;
  const head = SCOLS.map(([k, label, al]) => `<th scope="col" class="${al || ''}" aria-sort="${col === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-act="tsort" data-col="${k}">${label}${col === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('');
  const body = rows.map(r => {
    const open = T.open === r.key;
    const cells = [esc(r.sid), esc(r.name), r.finished, r.wins, r.b1 ?? '-', r.b2 ?? '-', r.b3 ?? '-', r.avg2 == null ? '-' : r.avg2.toFixed(1), `${r.badges}/${BADGES.length}`, r.last ? when(r.last) : '-'];
    return `<tr class="row${open ? ' open' : ''}" data-act="trow" data-key="${esc(r.key)}" tabindex="0" aria-expanded="${open}">${cells.map((c, i) => `<td class="${SCOLS[i][2] || ''}">${c}</td>`).join('')}</tr>`
      + (open ? `<tr class="t-detail"><td colspan="${SCOLS.length}">${studentDetail(r.raw)}</td></tr>` : '');
  }).join('');
  return `<div class="filters">${classFilter(groups)}<span class="count-inline">${rows.length}명</span><span class="spacer"></span>
  <button type="button" class="btn" data-act="tcsv"${rows.length ? '' : ' disabled'}>CSV로 내려받기</button></div>
${rows.length
    ? `<section class="panel t-section table-panel"><div class="table-wrap"><table class="t-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></section>
<p class="muted small t-section">줄을 누르면 모은 기록과 최근 경기가 펼쳐져요.</p>`
    : '<p class="muted t-section">아직 기록이 있는 학생이 없어요.</p>'}`;
}

function manageTabHTML() {

  <section class="panel">

/* ----- 동작 ----- */
function showCode(text) {
  const p = parseCode(text || '');
  if (!p) {
    const e = $('#tcodeErr');
    if (e) e.textContent = '경기 코드는 숫자 다섯 자리예요. 예: 2-4821';
    return;
  }
  T.code = formatCode(p.levelId, p.seed);
  T.tab = 'code';
  render();
  watchCode(T.code);
  const r = $('#codeResults');
  if (r && r.scrollIntoView) r.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
}
function armOrRun(kind, run) {
  if (T.armed !== kind) {
    T.armed = kind;
    clearTimeout(T.armTimer);
    T.armTimer = setTimeout(() => { T.armed = null; if (view === 'teacher') renderTeacherBody(); }, 3000);
    renderTeacherBody();
    return;
  }
  T.armed = null;
  clearTimeout(T.armTimer);
  run().then(() => renderTeacherBody()).catch(() => { T.err = '지우지 못했어요. 다시 시도해 주세요.'; renderTeacherBody(); });
}
async function clearEverything() {
  const inp = $('#tdelIn'), err = $('#tdelErr');
  if (!inp || inp.value.trim() !== '삭제') { if (err) err.textContent = '‘삭제’라고 정확히 입력해야 지울 수 있어요.'; return; }
  try {
    await Net.clearAll();
    T.players = {}; T.live = {}; T.games = {}; T.open = null;
    T.note = '모든 기록을 지웠어요.';
    if (Net.mode === 'local') { Net.stopPresence(false); me = null; game = null; lastResult = null; store.del(KEY.current); }
    renderTeacherBody();
  } catch (e) {
    if (err) err.textContent = '지우지 못했어요. 선생님 계정과 권한을 확인하고 다시 시도해 주세요.';
  }
}
function downloadCSV() {
  const rows = sortedStudents();
  const head = ['학번', '이름', '경기', '홈런', '기권', '입문 최소 타석', '기본 최소 타석', '도전 최소 타석', '기본 평균 타석', '모은 기록', '마지막 경기'];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head, ...rows.map(r => [
    r.sid, r.name, r.finished, r.wins, r.giveups, r.b1, r.b2, r.b3, r.avg2 == null ? '' : r.avg2.toFixed(1),
    toArr(r.raw.badges).length, r.last ? new Date(r.last).toLocaleString('ko-KR') : '',
  ])].map(r => r.map(cell).join(','));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const d = new Date();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `최대공약수숫자야구_기록_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function onTeacherAct(a) {
  switch (a.dataset.act) {
    case 'tsignin': teacherSignIn(); break;
    case 'tsignout':
      stopTeacherData();
      Net.teacherSignOut().catch(() => {}).then(() => { T.players = {}; T.live = {}; T.games = {}; render(); });
      break;
    case 'ttab': T.tab = a.dataset.tab; T.err = ''; T.note = ''; T.armed = null; render(); break;
    case 'tgenlv': T.genLevel = Number(a.dataset.level); renderTeacherBody(); break;
    case 'tgen': { const code = addTeacherCode(T.genLevel); T.reveal[code] = true; showCode(code); break; }
    case 'treveal': { const c = a.dataset.code; T.reveal[c] = !T.reveal[c]; renderTeacherBody(); break; }
    case 'tshow': showCode(a.dataset.code || ($('#tcodeIn') ? $('#tcodeIn').value : '')); break;
    case 'tsort': {
      const c = a.dataset.col;
      T.sort = T.sort.col === c ? { col: c, dir: -T.sort.dir } : { col: c, dir: 1 };
      renderTeacherBody();
      break;
    }
    case 'trow': { const k = a.dataset.key; T.open = T.open === k ? null : k; renderTeacherBody(); break; }
    case 'tcsv': downloadCSV(); break;
    case 'tclearLive': armOrRun('live', () => Net.clearLive()); break;
    case 'tclearAll': clearEverything(); break;
    default: break;
  }
}

document.addEventListener('change', e => {
  if (e.target.id !== 'tcls') return;
  T.cls = e.target.value;
  T.open = null;
  if (T.tab === 'code') renderCodeResults(); else renderTeacherBody();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="trow"]')) {
    e.preventDefault();
    onTeacherAct(e.target);
  }
});

/* ===== 시작 ===== */
function boot() {
  restorePlayer();
  if (location.hash === '#teacher') view = 'teacher';
  applyBig();
  render();
  Net.onStatus(() => {
    updateFoot();
    if (view === 'teacher') { render(); startTeacherData(); }
  });
  window.addEventListener('pagehide', () => { if (me && Net.mode === 'local') Net.stopPresence(true); });
  window.addEventListener('hashchange', () => { if (location.hash === '#teacher' && view !== 'teacher') openTeacher(); });
  Net.boot();
  syncAfterBoot();
  Net.ready.then(() => Net.watchHub(v => {
    const before = closedByTeacher();
    hubState = v;
    if (closedByTeacher() !== before && view !== 'teacher') render();
  }));
  if (view === 'teacher') startTeacherData();
}
boot();
</script>
</body>
</html>
