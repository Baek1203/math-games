<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --ink: #2b2140;
  --text: #2b2140;
  --text-soft: #62597a;
  --card: #ffffff;
  --card-2: #f3f1fa;
  --line: #dcd7ea;
  --edge: #2b2140;
  --gold-a: #ffd966;
  --gold-b: #ffc02e;
  --ok: #1f8a4c;
  --danger: #d8344c;
  --sky: linear-gradient(180deg, #6fc0ff 0%, #b3e1ff 40%, #e9f7ff 100%);
  --cloud: rgba(255, 255, 255, .6);
  --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --display: 'Black Han Sans', 'Jua', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --text: #f1edfb; --text-soft: #b8afcf; --card: #231d33; --card-2: #2d2641; --line: #3d3558; --edge: #0d0a16;
    --ok: #5fd08f; --danger: #ff7b8b;
    --sky: linear-gradient(180deg, #121634 0%, #232a5c 48%, #3a2f5f 100%); --cloud: rgba(255, 255, 255, .06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --text: #f1edfb; --text-soft: #b8afcf; --card: #231d33; --card-2: #2d2641; --line: #3d3558; --edge: #0d0a16;
  --ok: #5fd08f; --danger: #ff7b8b;
  --sky: linear-gradient(180deg, #121634 0%, #232a5c 48%, #3a2f5f 100%); --cloud: rgba(255, 255, 255, .06);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--font); line-height: 1.55;
  background: radial-gradient(38rem 9rem at 14% 5rem, var(--cloud), transparent 70%), radial-gradient(30rem 8rem at 84% 12rem, var(--cloud), transparent 70%), radial-gradient(26rem 7rem at 40% 30rem, var(--cloud), transparent 70%), var(--sky);
}
:focus-visible { outline: 3px solid #2c6bed; outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
p { max-width: 44rem; text-wrap: pretty; }
.wrap { width: 100%; max-width: 76rem; margin: 0 auto; padding: 1rem max(1rem, env(safe-area-inset-right, 0px)) 2.5rem max(1rem, env(safe-area-inset-left, 0px)); }

/* 머리 */
.head { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem 1.5rem; align-items: center; padding-top: .6rem; }
@media (min-width: 58rem) { .head { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); } }
.kicker { display: inline-block; margin: 0 0 .5rem; padding: .22rem .85rem; border-radius: 999px; background: #2b2140; color: #ffd23f; font-size: .95rem; }
.title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 8vw, 4.6rem); line-height: 1.02; letter-spacing: .01em; color: #ffd23f;
  text-shadow: 3px 0 0 #2b2140, -3px 0 0 #2b2140, 0 3px 0 #2b2140, 0 -3px 0 #2b2140, 2px 2px 0 #2b2140, -2px 2px 0 #2b2140, 2px -2px 0 #2b2140, -2px -2px 0 #2b2140, 0 9px 0 rgba(43, 33, 64, .35); }
.lead { margin: .7rem 0 0; font-size: 1.12rem; }
.who { display: inline-flex; align-items: center; gap: .55rem; margin: .9rem 0 0; padding: .35rem .95rem .35rem .4rem; border-radius: 999px; background: var(--card); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); font-size: 1.05rem; }
.who-no { padding: .1rem .6rem; border-radius: 999px; background: #2b2140; color: #ffd23f; }
.head-art { min-width: 0; }
.hero-art { display: block; width: 100%; height: auto; max-height: 17rem; }

/* 목록 */
.section { margin: 1.6rem 0 .9rem; font-family: var(--display); font-weight: 400; font-size: 1.9rem; display: flex; align-items: center; gap: .6rem; }
.section::after { content: ''; flex: 1; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--edge) 0 14px, transparent 14px 24px); opacity: .25; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1.3rem; }
.grid li { display: flex; }
.card { position: relative; display: flex; flex-direction: column; width: 100%; background: var(--card); color: var(--text); text-decoration: none; border: 3px solid var(--edge); border-radius: 22px; overflow: hidden; box-shadow: 0 7px 0 var(--edge); transition: transform .12s ease, box-shadow .12s ease; }
a.card:hover { transform: translateY(-4px); box-shadow: 0 11px 0 var(--edge); }
a.card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--edge); }
.cover { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 3px solid var(--edge); background: #cfe6b0; }
.art { display: block; width: 100%; height: 100%; }
a.card:hover .art { transform: scale(1.03); }
.art { transition: transform .25s ease; }
.card-body { display: flex; flex-direction: column; gap: .45rem; padding: 1rem 1.1rem 1.15rem; flex: 1; }
.name { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; }
.desc { color: var(--text-soft); font-size: 1.02rem; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { padding: .08rem .6rem; border-radius: 999px; background: var(--card-2); border: 2px solid var(--line); font-size: .85rem; color: var(--text-soft); }
.go { align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: .35rem; padding: .55rem 1.1rem; border-radius: 14px; background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2b2140; border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); font-size: 1.1rem; }
.go svg { width: 1.1em; height: 1.1em; }
.card .go { margin-top: .4rem; }
.card.soon { box-shadow: 0 7px 0 rgba(43, 33, 64, .35); border-style: dashed; }
.card.soon .art { filter: saturate(.55) brightness(.97); }
.tag { align-self: flex-start; margin-top: .4rem; padding: .3rem .8rem; border-radius: 999px; background: var(--card-2); border: 2px dashed var(--line); color: var(--text-soft); font-size: .92rem; }
.ribbon { position: absolute; top: .7rem; right: .7rem; display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .7rem; border-radius: 999px; background: #2b2140; color: #ffd23f; font-size: .9rem; border: 2px solid #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.ribbon.today { right: auto; left: .8rem; top: .8rem; background: #ff5a5f; color: #fff; font-size: 1.05rem; padding: .3rem .9rem; }
.feature { max-width: 64rem; }
@media (min-width: 52rem) {
  .feature { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .feature .cover { align-self: start; border-bottom: 0; border-right: 3px solid var(--edge); }
  .feature { align-items: stretch; }
  .feature .card-body { justify-content: center; padding: 1.6rem 1.8rem; gap: .7rem; }
}
.feature .name { font-size: 2.2rem; }
.feature .desc { font-size: 1.15rem; }
.feature .go { font-size: 1.3rem; padding: .75rem 1.5rem; }
.appear { animation: appear .5s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes appear { from { transform: scale(.9); opacity: 0; } }

/* 기다리는 화면, 불러오는 중 */
.empty { margin: 1.6rem auto 0; max-width: 40rem; padding: 1.2rem 1.5rem 1.6rem; background: var(--card); border: 3px solid var(--edge); border-radius: 22px; box-shadow: 0 7px 0 var(--edge); text-align: center; }
.empty p { margin-left: auto; margin-right: auto; }
.wait-art { display: block; width: min(18rem, 100%); margin: 0 auto .4rem; }
.empty-title { font-family: var(--display); font-size: 1.8rem; margin: .2rem 0 .3rem; }
.waiting { display: inline-flex; align-items: center; gap: .55rem; margin-top: .6rem; padding: .3rem .9rem; border-radius: 999px; background: var(--card-2); color: var(--text-soft); }
.pulse { width: .7rem; height: .7rem; border-radius: 50%; background: var(--ok); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .45; } }
.loading { display: flex; align-items: center; gap: .35rem; margin-top: 2rem; color: var(--text-soft); font-size: 1.1rem; }
.loading span { width: .7rem; height: .7rem; border-radius: 50%; background: var(--gold-b); border: 2px solid var(--edge); animation: bounce .9s ease-in-out infinite; }
.loading span:nth-child(2) { animation-delay: .15s; }
.loading span:nth-child(3) { animation-delay: .3s; margin-right: .5rem; }
@keyframes bounce { 50% { transform: translateY(-.5rem); } }

/* 그림 속 움직임 */
.art .hop, .hero-art .hop { animation: hop 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.art .bob, .hero-art .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.hero-art .b2, .hero-art .h2 { animation-delay: .4s; }
.hero-art .b3 { animation-delay: .8s; }
.hero-art .b4 { animation-delay: 1.2s; }
.hero-art .ball { animation: float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes hop { 50% { transform: translateY(-5%) scaleY(1.03); } }
@keyframes bob { 50% { transform: translateY(-3%); } }
@keyframes float { 50% { transform: translate(-6px, 6px) rotate(-12deg); } }

/* 아래 줄 */
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2.2rem; font-size: .95rem; }
.foot a, .link { color: inherit; opacity: .85; text-decoration: underline; text-underline-offset: .2em; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }

/* 선생님: 수업 관리 */
.t-head .title { font-size: clamp(2.4rem, 6vw, 3.4rem); }
.acct { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .6rem; justify-self: end; margin: 0; padding: .35rem .9rem; border-radius: 999px; background: var(--card); border: 3px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.panel { margin-top: 1.4rem; padding: 1.3rem 1.4rem 1.4rem; background: var(--card); border: 3px solid var(--edge); border-radius: 20px; box-shadow: 0 6px 0 var(--edge); }
.panel h2 { margin: 0 0 .4rem; font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1.2; }
.panel h3 { margin: 1.4rem 0 .6rem; font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.muted { color: var(--text-soft); margin-top: 0; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .7rem; margin-top: .8rem; }
.mode { display: flex; gap: .7rem; align-items: flex-start; padding: .8rem 1rem; border: 3px solid var(--line); border-radius: 16px; cursor: pointer; background: var(--card-2); }
.mode:has(input:checked) { border-color: var(--edge); background: #fff4c7; color: #2b2140; box-shadow: 0 4px 0 var(--edge); }
.mode input { margin-top: .35rem; width: 1.1rem; height: 1.1rem; accent-color: #2b2140; }
.mode b { display: block; font-weight: 400; font-size: 1.15rem; }
.mode small { display: block; font-size: .9rem; opacity: .8; }
.tlist { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
.tlist li { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .65rem .9rem; border: 2px solid var(--line); border-radius: 14px; background: var(--card-2); }
.tlist li.soon { opacity: .6; }
.tlist .link { margin-left: auto; }
.ord { display: inline-flex; gap: .25rem; }
.ord-btn { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border-radius: 10px; border: 2px solid var(--edge); background: var(--card); color: var(--text); cursor: pointer; box-shadow: 0 2px 0 var(--edge); }
.ord-btn svg { width: 1.05rem; height: 1.05rem; }
.ord-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.ord-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
.small { font-size: .92rem; }
.switch { display: inline-flex; align-items: center; gap: .7rem; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.knob { position: relative; width: 3.1rem; height: 1.75rem; border-radius: 999px; background: #c9c3d9; border: 3px solid var(--edge); transition: background .15s ease; flex: none; }
.knob::after { content: ''; position: absolute; top: .12rem; left: .15rem; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: #fff; border: 2px solid var(--edge); transition: transform .15s ease; }
.switch input:checked + .knob { background: #3fc56a; }
.switch input:checked + .knob::after { transform: translateX(1.3rem); }
.switch input:focus-visible + .knob { outline: 3px solid #2c6bed; outline-offset: 2px; }
.t-name { font-size: 1.1rem; }
.t-state { padding: .05rem .55rem; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: .85rem; color: var(--text-soft); }
.switch input:checked ~ .t-state { color: var(--ok); border-color: var(--ok); }
.status { margin: 1.3rem 0 0; padding: .8rem 1rem; border-radius: 14px; background: var(--card-2); border-left: 7px solid var(--gold-b); max-width: none; }
.chk { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
.chk li { display: grid; grid-template-columns: 1.9rem 1fr; gap: .6rem; align-items: start; padding: .65rem .85rem; border: 2px solid var(--line); border-radius: 14px; background: var(--card-2); }
.chk-mark { display: grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; color: #fff; background: #8a8f9c; border: 2px solid var(--edge); }
.chk-ok .chk-mark { background: #1f8a4c; }
.chk-bad { border-color: var(--danger); }
.chk-bad .chk-mark { background: #d8344c; }
.chk-d { display: block; margin-top: .15rem; line-height: 1.5; color: var(--text-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font: inherit; font-size: 1.1rem; padding: .7rem 1.2rem; border-radius: 14px; border: 3px solid var(--edge); background: var(--card); color: var(--text); cursor: pointer; box-shadow: 0 4px 0 var(--edge); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2b2140; }
.btn:disabled { opacity: .55; cursor: default; }
.err { color: var(--danger); margin: .8rem 0 0; }

@media (max-width: 40rem) {
  .hero-art { max-height: 12rem; }
  .section { font-size: 1.6rem; }
  .name { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 선수 등록 */
.who-switch { margin-left: .4rem; padding: .15rem .7rem; border-radius: 999px; border: 2px solid var(--edge); background: var(--card-2); color: var(--text); font: inherit; font-size: .88rem; cursor: pointer; }
.who-switch:hover { background: #fff4c7; color: #2b2140; }
.who-login { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin: 1rem 0 0; }
.who-login .muted { margin: 0; }
#dlg[hidden] { display: none; }
.dlg-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 1.2rem; background: rgba(20, 16, 40, .55); animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.dlg { position: relative; width: min(25rem, 100%); display: grid; gap: .8rem; margin-top: 3rem; padding: 2.4rem 1.5rem 1.3rem; background: var(--card); color: var(--text); border: 4px solid var(--edge); border-radius: 24px; box-shadow: 0 9px 0 var(--edge); animation: pop .3s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.dlg-pals { position: absolute; left: 50%; top: -3.9rem; transform: translateX(-50%); display: flex; align-items: flex-end; gap: .1rem; }
.dlg-pals img { width: 4.6rem; height: 4.6rem; }
.dlg-pals img:nth-child(2) { width: 3.4rem; height: 3.4rem; margin-bottom: .4rem; }
.dlg-title { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: 2rem; }
.dlg-sub { margin: 0; text-align: center; color: var(--text-soft); }
.fld { display: grid; gap: .3rem; font-size: 1.05rem; }
.fld input { font: inherit; font-size: 1.35rem; padding: .55rem .85rem; border: 3px solid var(--edge); border-radius: 14px; background: var(--card-2); color: var(--text); width: 100%; }
.fld input:focus { outline: 3px solid #2c6bed; outline-offset: 1px; }
.fld input::placeholder { color: var(--text-soft); opacity: .7; }
.dlg .err { margin: 0; min-height: 1.4em; }
.dlg-actions { display: flex; gap: .6rem; }
.dlg-actions .btn.primary { flex: 1; font-size: 1.25rem; }
.dlg-out { justify-self: center; font-size: .92rem; }

/* ===== 학교 방 ===== */
.who-room { display: inline-flex; align-items: center; gap: .3rem; padding: .05rem .6rem .05rem .35rem; border-radius: 999px; background: #fff4c7; color: #2b2140; border: 2px solid var(--edge); font-size: .9rem; }
.who-room svg, .room-opt svg, .room-chosen svg, .room-pill svg, .room-top h3 svg { width: 1.15rem; height: 1.15rem; flex: none; color: #2b2140; }
.fld-room { display: grid; gap: .4rem; }
.fld-lbl { font-size: 1.05rem; }
.room-search { font: inherit; font-size: 1.1rem; padding: .5rem .8rem; border: 3px solid var(--edge); border-radius: 14px; background: var(--card-2); color: var(--text); width: 100%; }
.room-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; max-height: 13rem; overflow-y: auto; }
.room-opt, .room-chosen { display: flex; align-items: center; gap: .5rem; width: 100%; padding: .45rem .7rem; border-radius: 12px; border: 2px solid var(--line); background: var(--card-2); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.room-opt:hover { border-color: var(--edge); background: #fff4c7; color: #2b2140; }
.room-opt span, .room-chosen span { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .4rem; flex: 1; }
.room-opt small, .room-chosen small { color: var(--text-soft); font-size: .82rem; }
.room-chosen { cursor: default; border-color: var(--edge); background: #fff4c7; color: #2b2140; margin: 0; }
.room-chosen small { color: #62597a; }
.room-chosen .link { font-size: .88rem; white-space: nowrap; }
.t-form { display: grid; gap: .7rem; max-width: 32rem; }
.t-form .btn { justify-self: start; }
.t-dl { display: grid; gap: .35rem; margin: .6rem 0 0; }
.t-dl div { display: flex; gap: .8rem; }
.t-dl dt { min-width: 3.5rem; color: var(--text-soft); }
.t-dl dd { margin: 0; }
.t-people li { align-items: flex-start; }
.t-who { display: grid; gap: .1rem; flex: 1; min-width: 12rem; }
.t-who small { color: var(--text-soft); }
.t-memo { font-style: normal; }
.t-btns { display: flex; flex-wrap: wrap; gap: .4rem; }
.t-btns .btn { padding: .4rem .9rem; font-size: 1rem; }
.room-pills { display: flex; flex-wrap: wrap; gap: .5rem; margin: .6rem 0 1rem; }
.room-pill { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .9rem; border-radius: 999px; border: 3px solid var(--edge); background: var(--card); color: var(--text); font: inherit; cursor: pointer; box-shadow: 0 3px 0 var(--edge); }
.room-pill[aria-selected="true"] { background: #2b2140; color: #ffd23f; }
.room-pill[aria-selected="true"] svg { color: #ffd23f; }
.room-pill.add { border-style: dashed; box-shadow: none; background: var(--card-2); }
.room-card { padding: 1rem 1.1rem; border-radius: 16px; background: var(--card-2); border: 2px solid var(--line); }
.room-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; }
.room-top h3 { display: flex; align-items: center; gap: .4rem; margin: 0; }
.room-code { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin: .8rem 0 .3rem; font-size: 1.1rem; }
.room-code b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; letter-spacing: .08em; padding: .1rem .7rem; border-radius: 12px; background: #2b2140; color: #ffd23f; }
.btn.danger-soft { background: var(--card); color: var(--danger); font-size: .95rem; padding: .45rem .9rem; }
.acct .role { padding: .05rem .55rem; border-radius: 999px; background: #d8344c; color: #fff; font-size: .82rem; }
.ok-note { border-left-color: #1f8a4c; }
.room-form h3 { margin: 0; }
.btn.danger-soft.armed { background: #d8344c; color: #fff; }
.room-card .code-form { margin: .8rem 0 1rem; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

function loadScript(src, ms) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const timer = setTimeout(() => reject(new Error('timeout')), ms);
    s.src = src;
    s.async = false;
    s.onload = () => { clearTimeout(timer); resolve(); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('load')); };
    document.head.appendChild(s);
  });
}
async function boot() {
  render();

  try {
    for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']) {

    const FB = window.firebase;
    FB.initializeApp(cfg);

function openLogin(next) {
  LOGIN.open = true;

  if (needRoom() && H.dir === null) loadDirectory().then(() => { if (!LOGIN.open) return; const l = $('#roomList'); if (l) l.innerHTML = roomsListHTML(); else drawLogin(); });
  setTimeout(() => { const i = box.querySelector(needRoom() && !LOGIN.pick ? '#roomSearch' : 'input[name="sid"]'); if (i) i.focus(); }, 30);
}
function closeLogin() {
  LOGIN.open = false;
  const box = $('#dlg');
  box.hidden = true;

async function submitLogin(form) {
  const err = $('#loginErr');
  const sid = form.elements.sid.value.replace(/\s+/g, '');
  const name = form.elements.name.value.replace(/\s+/g, '');
  if (!/^\d{4,6}$/.test(sid)) { err.textContent = '학번은 숫자 4~6자리로 입력하세요. 예: 10523'; form.elements.sid.focus(); return; }
  if (!name) { err.textContent = '이름을 입력하세요.'; form.elements.name.focus(); return; }
  if (name.length > 20) { err.textContent = '이름은 20자까지 입력할 수 있어요.'; form.elements.name.focus(); return; }
  let room = H.room;
  if (needRoom()) {
    if (!LOGIN.pick) { err.textContent = '먼저 학교 방을 골라 주세요.'; const s = $('#roomSearch'); if (s) s.focus(); return; }
    if (!H.room || H.room.id !== LOGIN.pick) {
      const code = normCode(form.elements.code ? form.elements.code.value : '');
      if (!validCode(code)) { err.textContent = '입장 코드를 넣어 주세요. 영어와 숫자 4~12자리예요.'; if (form.elements.code) form.elements.code.focus(); return; }
      const r = (H.dir || []).find(x => x.id === LOGIN.pick);
      let key = null;
      try { key = await checkDoor(LOGIN.pick, code); } catch (e) { err.textContent = '학급 서버에 닿지 않아요. 인터넷 연결을 확인해 주세요.'; return; }
      if (!key) { err.textContent = '입장 코드가 맞지 않아요. 선생님께 코드를 다시 확인해 주세요.'; form.elements.code.focus(); form.elements.code.select(); return; }
      room = { id: LOGIN.pick, key, school: r ? r.school : '', label: r ? r.label || '' : '', teacher: r ? r.teacher || '' : '' };
    }
  }
  try {
    localStorage.setItem('mathgames.student', JSON.stringify({ sid, name }));
    if (room) localStorage.setItem('mathgames.room', JSON.stringify(room));
  } catch (e) { /* 저장할 수 없는 브라우저 */ }
  const changedRoom = room && (!H.room || H.room.id !== room.id);
  H.room = readRoom();
  const next = LOGIN.next;
  closeLogin();
  if (next) { location.href = next; return; }
  if (changedRoom) watchStudentRoom();
  render();
  $('#announce').textContent = `${room ? roomName(room) + ' 방, ' : ''}${sid} ${name} 선수로 입장했어요.`;
}
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('dlg-back')) { closeLogin(); return; }
  const card = e.target.closest('a.card[data-game]');
  if (card && !isTeacherView() && H.mode === 'firebase' && !registered()) {
    e.preventDefault();
    openLogin(card.getAttribute('href'));
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'login' || act === 'switch') openLogin('');
  else if (act === 'dlgClose') closeLogin();
  else if (act === 'pickRoom') { LOGIN.pick = a.dataset.id; drawLogin(); const c = $('#loginForm input[name="code"]'); if (c) c.focus(); }
  else if (act === 'unpickRoom') { LOGIN.pick = null; drawLogin(); const s = $('#roomSearch'); if (s) s.focus(); }
  else if (act === 'logout') {
    try { localStorage.removeItem('mathgames.student'); localStorage.removeItem('mathgames.room'); } catch (x) { /* 무시 */ }
    H.room = null; closeLogin(); watchStudentRoom(); render();
  }
});
document.addEventListener('input', e => {

  } else if (!H.user) {
    body = `<section class="panel">
  <h2>선생님 로그인</h2>
  <p class="muted">Google 계정으로 로그인하세요. 처음이면 가입 신청을 보내고, 관리자가 승인하면 학교 방을 만들어 게임을 열 수 있어요.</p>
  <button type="button" class="btn primary" data-act="signin"${H.busy ? ' disabled' : ''}>${H.busy ? '로그인하는 중…' : 'Google 계정으로 로그인'}</button>
  ${H.err ? `<p class="err">${esc(H.err)}</p>` : ''}
</section>`;
  } else if (H.prof === undefined) {
    body = '<section class="panel"><p class="loading"><span></span><span></span><span></span>선생님 정보를 확인하고 있어요.</p></section>';
  } else {
    const parts = [];
    if (H.note) parts.push(`<p class="status ok-note" role="status">${esc(H.note)}</p>`);
    if (H.err) parts.push(`<p class="err" role="alert">${esc(H.err)}</p>`);
    if (H.isAdmin) parts.push(adminHTML());
    if (canManage()) { parts.push(roomsHTML()); if (curRoom() && H.form !== 'room') parts.push(viewHTML()); }
    else if (!H.prof) parts.push(signupHTML());
    else if (H.prof.status === 'pending') parts.push(pendingHTML());
    else parts.push(rejectedHTML());
    body = parts.join('');
  }
  const who = H.user ? `<p class="acct">${H.isAdmin ? '<span class="role">관리자</span>' : ''}${esc(H.user.email || '')}<button type="button" class="link" data-act="signout">로그아웃</button></p>` : '';
  return `<header class="head t-head">
  <div><p class="kicker">선생님 전용</p><h1 class="title"><span>수업 관리</span></h1><p class="lead">학교 방을 만들고, 방마다 학생들이 볼 게임을 정해요.</p></div>
  ${who}
</header>
${body}
${H.mode === 'pending' ? '' : checkHTML()}
<footer class="foot"><span></span><a href="#">학생 화면 보기</a></footer>`;
}
(function fromGame() {
  const q = new URLSearchParams(location.search);
  if (q.get('login') === '1' && !isTeacherView()) {
    const go = () => { if (H.mode === 'pending') { setTimeout(go, 80); return; } openLogin(q.get('next')); };
    setTimeout(go, 0);
  }
})();

boot();
</script>
</body>
</html>
